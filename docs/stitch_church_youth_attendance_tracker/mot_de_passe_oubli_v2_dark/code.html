<body class="min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Background Decorative Element -->
<div class="fixed inset-0 overflow-hidden pointer-events-none">
<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] bg-primary/10 rounded-full blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[40%] h-[40%] bg-primary/5 rounded-full blur-[120px]"></div>
</div>
<!-- Main Content Card -->
<main class="w-full max-w-[440px] relative z-10">
<!-- Header / Illustration Section -->
<div class="flex flex-col items-center text-center mb-lg">
<div class="w-20 h-20 bg-[#1E1B4B] rounded-full flex items-center justify-center mb-md shadow-lg animate-float">
<span class="material-symbols-outlined text-[40px] text-[#818CF8]" data-icon="lock_reset">lock_reset</span>
</div>
<h1 class="font-display text-display text-[#F1F5F9] mb-sm tracking-tight">
                Mot de passe oublié ?
            </h1>
<p class="font-body-lg text-body-lg text-[#94A3B8] max-w-[320px]">
                Pas de soucis, nous vous enverrons les instructions de réinitialisation par e-mail.
            </p>
</div>
<!-- Form Section -->
<div class="bg-surface-container-lowest/50 backdrop-blur-xl border border-white/5 p-lg rounded-xl shadow-xl">
<form class="space-y-lg" id="forgotPasswordForm" onsubmit="return false;">
<div class="space-y-xs">
<label class="font-label-md text-label-md text-[#94A3B8] block ml-1 uppercase tracking-wider" for="email">
                        Adresse e-mail
                    </label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-md flex items-center pointer-events-none text-[#94A3B8] group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined text-body-lg" data-icon="mail">mail</span>
</div>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-xl py-3.5 pl-11 pr-md text-[#F1F5F9] placeholder-[#475569] focus:outline-none focus:ring-2 focus:ring-primary/50 focus:border-primary transition-all duration-200" id="email" name="email" placeholder="nom@eglise.fr" required="" type="email"/>
</div>
</div>
<button class="w-full bg-[#6366F1] hover:bg-[#4F46E5] active:scale-[0.98] text-white font-headline-md text-headline-md py-3.5 rounded-xl transition-all duration-200 shadow-lg shadow-primary/20 flex items-center justify-center gap-sm" id="submitButton" type="submit">
                    Envoyer le lien
                    <span class="material-symbols-outlined" data-icon="arrow_forward">arrow_forward</span>
</button>
</form>
<div class="mt-lg pt-lg border-t border-[#334155]/50 text-center">
<a class="inline-flex items-center gap-xs font-body-md text-body-md text-[#94A3B8] hover:text-[#F1F5F9] transition-colors duration-200 group" href="#">
<span class="material-symbols-outlined text-body-md group-hover:-translate-x-1 transition-transform" data-icon="arrow_back">arrow_back</span>
                    Retour à la connexion
                </a>
</div>
</div>
<!-- Footer Help -->
<p class="mt-xl text-center font-label-md text-label-md text-[#475569]">
            Vous n'avez pas de compte ? 
            <a class="text-[#818CF8] hover:underline font-semibold" href="#">Inscrivez-vous</a>
</p>
</main>
<!-- Micro-interaction Script -->
<script>
        document.getElementById('forgotPasswordForm').addEventListener('submit', function() {
            const btn = document.getElementById('submitButton');
            const originalContent = btn.innerHTML;
            
            // Loading state
            btn.disabled = true;
            btn.innerHTML = `
                <svg class="animate-spin h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24">
                    <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
                    <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4zm2 5.291A7.962 7.962 0 014 12H0c0 3.042 1.135 5.824 3 7.938l3-2.647z"></path>
                </svg>
                Envoi en cours...
            `;

            // Mock success after delay
            setTimeout(() => {
                btn.innerHTML = `
                    <span class="material-symbols-outlined" data-icon="check_circle" style="font-variation-settings: 'FILL' 1;">check_circle</span>
                    E-mail envoyé !
                `;
                btn.classList.remove('bg-[#6366F1]');
                btn.classList.add('bg-secondary');
                
                // Show a toast or feedback here in a real app
                console.log('Reset link sent to: ' + document.getElementById('email').value);
            }, 1500);
        });
    </script>
