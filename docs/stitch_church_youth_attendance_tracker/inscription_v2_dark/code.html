<style>
        body {
            background-color: #0F172A;
            color: #F1F5F9;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .step-active { background-color: #6366F1; color: #F1F5F9; border-color: #6366F1; }
        .step-inactive { background-color: #293548; color: #64748B; border-color: #334155; }
        .line-active { background-color: #6366F1; }
        .line-inactive { background-color: #334155; }
        
        /* Custom Input Styling */
        input::placeholder { color: #64748B; }
        .strength-segment { background-color: #293548; height: 4px; border-radius: 2px; flex: 1; transition: background-color 0.3s ease; }
        .strength-filled { background-color: #6366F1; }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="min-h-screen flex flex-col items-center">
<!-- Top Navigation Container -->
<header class="w-full max-w-md flex items-center justify-between px-margin-mobile h-16">
<button class="p-2 -ml-2 text-[#94A3B8] hover:bg-surface-container-low rounded-full transition-colors active:scale-95">
<span class="material-symbols-outlined text-2xl">arrow_back</span>
</button>
<div class="flex-1 px-4">
<h1 class="font-headline-md text-headline-md text-[#F1F5F9]">Créer un compte</h1>
</div>
<div class="w-10"></div> <!-- Spacer for symmetry -->
</header>
<main class="w-full max-w-md px-margin-mobile flex flex-col gap-lg py-lg">
<!-- Step Indicator -->
<section class="flex items-center justify-between w-full px-lg">
<div class="flex flex-col items-center gap-xs relative z-10">
<div class="w-10 h-10 rounded-full flex items-center justify-center step-active font-headline-md text-headline-md">1</div>
<span class="font-label-md text-label-md text-[#6366F1]">Profil</span>
</div>
<div class="flex-1 h-0.5 line-inactive -mt-6"></div>
<div class="flex flex-col items-center gap-xs relative z-10">
<div class="w-10 h-10 rounded-full flex items-center justify-center step-inactive font-headline-md text-headline-md">2</div>
<span class="font-label-md text-label-md text-[#64748B]">Accès</span>
</div>
<div class="flex-1 h-0.5 line-inactive -mt-6"></div>
<div class="flex flex-col items-center gap-xs relative z-10">
<div class="w-10 h-10 rounded-full flex items-center justify-center step-inactive font-headline-md text-headline-md">3</div>
<span class="font-label-md text-label-md text-[#64748B]">Groupe</span>
</div>
</section>
<!-- Registration Form Card -->
<section class="bg-[#1E293B] rounded-xl p-md border border-[#334155] shadow-sm animate-in fade-in slide-in-from-bottom-4 duration-500">
<form class="flex flex-col gap-md">
<!-- Name Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#94A3B8]">Nom complet</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#64748B] group-focus-within:text-[#6366F1]">person</span>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-xl py-3 pl-11 pr-4 text-[#F1F5F9] focus:ring-2 focus:ring-[#6366F1] focus:border-[#6366F1] transition-all outline-none" placeholder="Jean Dupont" type="text"/>
</div>
</div>
<!-- Email Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#94A3B8]">Email professionnel</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#64748B] group-focus-within:text-[#6366F1]">mail</span>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-xl py-3 pl-11 pr-4 text-[#F1F5F9] focus:ring-2 focus:ring-[#6366F1] focus:border-[#6366F1] transition-all outline-none" placeholder="jean.dupont@church.org" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#94A3B8]">Mot de passe</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#64748B] group-focus-within:text-[#6366F1]">lock</span>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-xl py-3 pl-11 pr-11 text-[#F1F5F9] focus:ring-2 focus:ring-[#6366F1] focus:border-[#6366F1] transition-all outline-none" id="password-input" placeholder="••••••••••••" type="password"/>
<button class="absolute right-3 top-1/2 -translate-y-1/2 text-[#64748B] hover:text-[#F1F5F9]" type="button">
<span class="material-symbols-outlined">visibility_off</span>
</button>
</div>
<!-- Password Strength -->
<div class="flex gap-1 mt-1">
<div class="strength-segment" id="s1"></div>
<div class="strength-segment" id="s2"></div>
<div class="strength-segment" id="s3"></div>
<div class="strength-segment" id="s4"></div>
</div>
<span class="font-label-sm text-label-sm text-[#64748B]">Minimum 8 caractères, un chiffre et un symbole.</span>
</div>
<!-- Phone Field (Optional) -->
<div class="flex flex-col gap-xs">
<label class="font-label-md text-label-md text-[#94A3B8]">Téléphone (Optionnel)</label>
<div class="relative group">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-[#64748B] group-focus-within:text-[#6366F1]">call</span>
<input class="w-full bg-[#1E293B] border border-[#334155] rounded-xl py-3 pl-11 pr-4 text-[#F1F5F9] focus:ring-2 focus:ring-[#6366F1] focus:border-[#6366F1] transition-all outline-none" placeholder="+33 6 00 00 00 00" type="tel"/>
</div>
</div>
<div class="mt-lg">
<button class="w-full bg-[#6366F1] text-[#F1F5F9] py-4 rounded-xl font-headline-md text-headline-md shadow-lg shadow-[#6366F1]/20 hover:brightness-110 active:scale-95 transition-all" type="button">
                        Suivant
                    </button>
</div>
</form>
</section>
<!-- Terms & Privacy -->
<p class="text-center font-label-md text-label-md text-[#64748B] px-lg">
            En continuant, vous acceptez nos <a class="text-[#6366F1] hover:underline" href="#">Conditions d'utilisation</a> et notre <a class="text-[#6366F1] hover:underline" href="#">Politique de confidentialité</a>.
        </p>
<!-- Login Redirect -->
<div class="flex items-center justify-center gap-base mt-auto pb-lg">
<span class="font-body-md text-body-md text-[#94A3B8]">Déjà un compte ?</span>
<button class="font-body-md text-body-md text-[#6366F1] font-bold hover:underline">Se connecter</button>
</div>
</main>
<!-- Footer Decorative Shape (Subtle glow) -->
<div class="fixed bottom-0 left-1/2 -translate-x-1/2 w-full h-32 bg-gradient-to-t from-[#6366F1]/5 to-transparent pointer-events-none"></div>
<script>
        // Password strength mockup interaction
        const passwordInput = document.getElementById('password-input');
        const segments = [
            document.getElementById('s1'),
            document.getElementById('s2'),
            document.getElementById('s3'),
            document.getElementById('s4')
        ];

        passwordInput.addEventListener('input', (e) => {
            const val = e.target.value;
            const strength = Math.min(val.length / 2, 4);
            
            segments.forEach((seg, i) => {
                if (i < strength) {
                    seg.classList.add('strength-filled');
                    // Simple color change for higher strength
                    if(strength >= 3) seg.style.backgroundColor = '#10B981';
                    else seg.style.backgroundColor = '#6366F1';
                } else {
                    seg.classList.remove('strength-filled');
                    seg.style.backgroundColor = '#293548';
                }
            });
        });

        // Toggle Password Visibility
        const toggleBtn = passwordInput.nextElementSibling;
        toggleBtn.addEventListener('click', () => {
            const isPass = passwordInput.type === 'password';
            passwordInput.type = isPass ? 'text' : 'password';
            toggleBtn.children[0].textContent = isPass ? 'visibility' : 'visibility_off';
        });
    </script>
</body></html>
