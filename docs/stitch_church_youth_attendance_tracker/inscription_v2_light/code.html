<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<title>ChurchPresence - Créer un compte</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&amp;display=swap" rel="stylesheet"/>

<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
      tailwind.config = {
        darkMode: "class",
        theme: {
          extend: {
            "colors": {
                "outline-variant": "#c7c4d8",
                "on-primary-container": "#dad7ff",
                "error": "#ba1a1a",
                "inverse-on-surface": "#ebf1ff",
                "outline": "#777587",
                "on-surface-variant": "#464555",
                "on-primary-fixed-variant": "#3323cc",
                "secondary": "#006c49",
                "primary-fixed": "#e2dfff",
                "background": "#f9f9ff",
                "surface-container-low": "#f0f3ff",
                "secondary-fixed": "#6ffbbe",
                "primary-container": "#4f46e5",
                "surface-tint": "#4d44e3",
                "tertiary-fixed-dim": "#d0bcff",
                "on-secondary": "#ffffff",
                "surface-container-lowest": "#ffffff",
                "on-secondary-fixed": "#002113",
                "surface-variant": "#dce2f3",
                "on-tertiary-fixed-variant": "#5516be",
                "inverse-primary": "#c3c0ff",
                "secondary-container": "#6cf8bb",
                "primary": "#3525cd",
                "on-error": "#ffffff",
                "on-background": "#151c27",
                "surface-container-high": "#e2e8f8",
                "primary-fixed-dim": "#c3c0ff",
                "on-primary": "#ffffff",
                "on-tertiary-fixed": "#23005c",
                "surface-container-highest": "#dce2f3",
                "on-error-container": "#93000a",
                "on-secondary-fixed-variant": "#005236",
                "inverse-surface": "#2a313d",
                "tertiary-fixed": "#e9ddff",
                "on-surface": "#151c27",
                "tertiary-container": "#6f3dd9",
                "on-secondary-container": "#00714d",
                "on-tertiary-container": "#e3d5ff",
                "on-primary-fixed": "#0f0069",
                "tertiary": "#571ac0",
                "surface": "#f9f9ff",
                "secondary-fixed-dim": "#4edea3",
                "surface-container": "#e7eefe",
                "surface-dim": "#d3daea",
                "on-tertiary": "#ffffff",
                "surface-bright": "#f9f9ff",
                "error-container": "#ffdad6"
            },
            "borderRadius": {
                "DEFAULT": "0.25rem",
                "lg": "0.5rem",
                "xl": "0.75rem",
                "full": "9999px"
            },
            "spacing": {
                "margin-tablet": "32px",
                "xl": "32px",
                "sm": "8px",
                "lg": "24px",
                "base": "4px",
                "xs": "4px",
                "gutter": "16px",
                "md": "16px",
                "margin-mobile": "16px"
            },
            "fontFamily": {
                "headline-md": ["Inter"],
                "body-md": ["Inter"],
                "label-md": ["Inter"],
                "body-lg": ["Inter"],
                "label-sm": ["Inter"],
                "display": ["Inter"],
                "headline-lg": ["Inter"]
            },
            "fontSize": {
                "headline-md": ["20px", {"lineHeight": "28px", "fontWeight": "600"}],
                "body-md": ["14px", {"lineHeight": "20px", "fontWeight": "400"}],
                "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}],
                "body-lg": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                "label-sm": ["11px", {"lineHeight": "14px", "fontWeight": "500"}],
                "display": ["30px", {"lineHeight": "38px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                "headline-lg": ["24px", {"lineHeight": "32px", "letterSpacing": "-0.01em", "fontWeight": "600"}]
            }
          },
        },
      }
    </script>
<style>
      body {
        font-family: 'Inter', sans-serif;
        background-color: #f9f9ff;
      }
      .material-symbols-outlined {
        font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
      }
      .step-line {
        height: 2px;
        flex-grow: 1;
        background-color: #F3F4F6;
        margin: 0 12px;
      }
      .password-strength-segment {
        height: 4px;
        border-radius: 2px;
        background-color: #E5E7EB;
        flex: 1;
        transition: background-color 0.3s ease;
      }
      .password-strength-segment.active {
        background-color: #4F46E5;
      }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- Header Minimal -->
<header class="w-full max-w-md px-margin-mobile h-16 flex items-center justify-between">
<button aria-label="Retour" class="p-2 -ml-2 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<span class="font-headline-md text-headline-md text-primary font-bold">Ecclesia Flow</span>
<div class="w-10"></div> <!-- Spacer -->
</header>
<main class="w-full max-w-md px-margin-mobile pb-xl">
<!-- Welcome Section -->
<div class="mt-8 mb-xl">
<h1 class="text-[24px] font-[800] text-[#111827] leading-tight">Créer un compte</h1>
<p class="text-[#6B7280] font-body-lg text-body-lg mt-xs">Commencez à gérer vos présences</p>
</div>
<!-- Stepper Indicator -->
<div class="flex items-center justify-between mb-xl relative">
<!-- Step 1 -->
<div class="flex flex-col items-center z-10">
<div class="w-10 h-10 rounded-full bg-primary-container text-white flex items-center justify-center font-bold shadow-sm">
                    1
                </div>
<span class="text-label-md font-label-md mt-sm text-primary">Compte</span>
</div>
<div class="step-line"></div>
<!-- Step 2 -->
<div class="flex flex-col items-center z-10">
<div class="w-10 h-10 rounded-full bg-[#F3F4F6] text-[#9CA3AF] flex items-center justify-center font-bold">
                    2
                </div>
<span class="text-label-md font-label-md mt-sm text-[#9CA3AF]">Église</span>
</div>
<div class="step-line"></div>
<!-- Step 3 -->
<div class="flex flex-col items-center z-10">
<div class="w-10 h-10 rounded-full bg-[#F3F4F6] text-[#9CA3AF] flex items-center justify-center font-bold">
                    3
                </div>
<span class="text-label-md font-label-md mt-sm text-[#9CA3AF]">Profil</span>
</div>
</div>
<!-- Registration Form Card -->
<div class="bg-white p-md rounded-xl shadow-sm border border-outline-variant/30">
<form class="space-y-lg">
<!-- Name Row -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="firstname">Prénom</label>
<input class="w-full h-12 px-md rounded-xl border border-[#E5E7EB] focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-body-md" id="firstname" placeholder="Jean" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="lastname">Nom</label>
<input class="w-full h-12 px-md rounded-xl border border-[#E5E7EB] focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-body-md" id="lastname" placeholder="Dupont" type="text"/>
</div>
</div>
<!-- Email -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full h-12 pl-12 pr-md rounded-xl border border-[#E5E7EB] focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-body-md" id="email" placeholder="votre@email.com" type="email"/>
</div>
</div>
<!-- Password -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="password">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 pl-12 pr-12 rounded-xl border border-[#E5E7EB] focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-body-md" id="password" placeholder="••••••••" type="password"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
<!-- Password Strength -->
<div class="flex gap-1.5 mt-2 px-1">
<div class="password-strength-segment active"></div>
<div class="password-strength-segment active"></div>
<div class="password-strength-segment"></div>
<div class="password-strength-segment"></div>
</div>
<p class="text-label-sm font-label-sm text-on-surface-variant px-1 mt-1">Force : Moyen</p>
</div>
<!-- Confirm Password -->
<div class="space-y-xs">
<label class="font-label-sm text-label-sm text-on-surface-variant px-1" for="confirm-password">Confirmer le mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-4 top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full h-12 pl-12 pr-md rounded-xl border border-[#E5E7EB] focus:border-primary-container focus:ring-1 focus:ring-primary-container outline-none transition-all font-body-md text-body-md" id="confirm-password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Next Button -->
<button class="w-full h-14 bg-primary-container text-white rounded-xl font-headline-md text-headline-md flex items-center justify-center gap-2 shadow-md hover:bg-primary transition-all active:scale-[0.98] mt-lg" type="submit">
<span>Suivant</span>
<span class="material-symbols-outlined">arrow_forward</span>
</button>
</form>
</div>
<!-- Footer Link -->
<div class="mt-xl text-center">
<p class="font-body-md text-body-md text-on-surface-variant">
                Déjà un compte ? 
                <a class="text-primary font-bold hover:underline" href="#">Se connecter</a>
</p>
</div>
</main>
<!-- Contextual Graphic (Atmospheric) -->
<div class="fixed bottom-0 left-0 w-full overflow-hidden opacity-10 pointer-events-none -z-10">

</div>
<script>
        // Simple micro-interaction for password visibility
        document.querySelectorAll('button[type="button"]').forEach(btn => {
            btn.addEventListener('click', function() {
                const input = this.parentElement.querySelector('input');
                const icon = this.querySelector('.material-symbols-outlined');
                if (input.type === 'password') {
                    input.type = 'text';
                    icon.textContent = 'visibility_off';
                } else {
                    input.type = 'password';
                    icon.textContent = 'visibility';
                }
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Logical flow would go to Step 2
        });
    </script>
</body></html>
