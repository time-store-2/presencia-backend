<body class="min-h-screen flex items-center justify-center p-4">
<!-- Auth Container -->
<div class="w-full max-w-[400px] flex flex-col items-center">
<!-- Logo Section -->
<div class="mb-lg flex flex-col items-center">
<div class="w-[72px] h-[72px] rounded-xl bg-[#EEF2FF] flex items-center justify-center mb-md transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-[#4F46E5] text-[40px]" data-icon="church">church</span>
</div>
<h1 class="text-[22px] font-extrabold text-[#111827] tracking-tight">Bentiel Présences</h1>
<p class="text-[15px] text-[#6B7280] mt-1">Bon retour 👋</p>
</div>
<!-- Login Card -->
<div class="w-full bg-white rounded-xl p-lg card-auth border border-[#E5E7EB]">
<form action="#" class="space-y-md" method="POST">
<!-- Email Field -->
<div class="space-y-base">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Adresse email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#9CA3AF] text-[20px] group-focus-within:text-[#4F46E5]" data-icon="mail">mail</span>
</div>
<input class="w-full pl-10 pr-4 py-3 bg-white border border-[#E5E7EB] rounded-xl text-body-md focus:outline-none focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent transition-all" id="email" name="email" placeholder="nom@exemple.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-base">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Mot de passe</label>
<a class="text-label-md font-semibold text-[#4F46E5] hover:underline" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative group" id="password-container">
<div class="absolute inset-y-0 left-0 pl-3 flex items-center pointer-events-none">
<span class="material-symbols-outlined text-[#9CA3AF] text-[20px] group-focus-within:text-[#4F46E5]" data-icon="lock">lock</span>
</div>
<input class="w-full pl-10 pr-10 py-3 bg-white border border-[#E5E7EB] rounded-xl text-body-md focus:outline-none focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent transition-all" id="password" name="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute inset-y-0 right-0 pr-3 flex items-center text-[#9CA3AF] hover:text-[#6B7280]" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" data-icon="visibility" id="password-toggle-icon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-[#4F46E5] text-white py-3 px-4 rounded-xl font-body-md font-semibold btn-shadow hover:bg-[#4338CA] active:scale-95 transition-all flex items-center justify-center space-x-2" type="submit">
<span>Se connecter</span>
</button>
<!-- Separator -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#E5E7EB]"></div>
</div>
<div class="relative flex justify-center text-[13px] uppercase tracking-wider">
<span class="bg-white px-2 text-[#9CA3AF] font-medium">OU</span>
</div>
</div>
<!-- Social Login -->
<button class="w-full bg-white border border-[#E5E7EB] text-[#374151] py-3 px-4 rounded-xl font-body-md font-medium hover:bg-surface-container-low transition-colors flex items-center justify-center space-x-3" type="button">

<!-- Micro-interaction Scripts -->
<script>
        function togglePassword() {
            const input = document.getElementById('password');
            const icon = document.getElementById('password-toggle-icon');
            
            if (input.type === 'password') {
                input.type = 'text';
                icon.textContent = 'visibility_off';
                icon.setAttribute('data-icon', 'visibility_off');
            } else {
                input.type = 'password';
                icon.textContent = 'visibility';
                icon.setAttribute('data-icon', 'visibility');
            }
        }

        // Simple form animation
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
