<html class="dark" lang="fr"><head>

                    },

<style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #0F172A;
            color: #F1F5F9;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .glass-card {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(51, 65, 85, 0.5);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">
<!-- Ambient Animated Background Component -->
<div class="fixed inset-0 z-0 overflow-hidden pointer-events-none">

</div>
<!-- Login Container -->
<main class="relative z-10 w-full max-w-[420px] animate-in fade-in slide-in-from-bottom-4 duration-700">
<!-- Brand Identity Section -->
<div class="flex flex-col items-center mb-10">
<div class="w-16 h-16 bg-[#1E1B4B] rounded-2xl flex items-center justify-center mb-6 shadow-xl ring-1 ring-white/10">
<span class="material-symbols-outlined text-[#818CF8] !text-4xl" style="font-variation-settings: 'FILL' 1;">church</span>
</div>
<h1 class="font-headline-lg text-headline-lg text-[#F1F5F9] mb-2 tracking-tight">Bentiel Présences</h1>
<p class="font-body-md text-body-md text-[#94A3B8]">Bon retour 👋</p>
</div>
<!-- Card Container -->
<div class="bg-[#1E293B] rounded-2xl p-8 shadow-2xl border border-[#334155] transition-all hover:shadow-indigo-500/10">
<!-- Login Form -->
<form class="space-y-6" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-2">
<label class="font-label-md text-label-md text-[#CBD5E1] ml-1" for="email">Adresse email</label>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#64748B] group-focus-within:text-[#818CF8] transition-colors">
<span class="material-symbols-outlined text-[20px]">mail</span>
</div>
<input class="block w-full pl-11 pr-4 py-3 bg-[#1E293B] border border-[#334155] rounded-xl text-[#F1F5F9] placeholder-[#64748B] focus:ring-2 focus:ring-[#6366F1] focus:border-transparent transition-all outline-none" id="email" placeholder="nom@eglise.com" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-2">
<div class="flex justify-between items-center px-1">
<label class="font-label-md text-label-md text-[#CBD5E1]" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-[#818CF8] hover:underline transition-all" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative group">
<div class="absolute inset-y-0 left-0 pl-4 flex items-center pointer-events-none text-[#64748B] group-focus-within:text-[#818CF8] transition-colors">
<span class="material-symbols-outlined text-[20px]">lock</span>
</div>
<input class="block w-full pl-11 pr-12 py-3 bg-[#1E293B] border border-[#334155] rounded-xl text-[#F1F5F9] placeholder-[#64748B] focus:ring-2 focus:ring-[#6366F1] focus:border-transparent transition-all outline-none" id="password" placeholder="••••••••" type="password"/>
<button class="absolute inset-y-0 right-0 pr-4 flex items-center text-[#64748B] hover:text-[#F1F5F9] transition-colors" type="button">
<span class="material-symbols-outlined text-[20px]">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full py-3.5 bg-[#6366F1] hover:bg-[#4F46E5] text-[#F1F5F9] font-semibold rounded-xl shadow-lg shadow-indigo-500/20 active:scale-[0.98] transition-all flex items-center justify-center gap-2" type="submit">
                    Se connecter
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Separator -->
<div class="relative my-8">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-[#334155]"></div>
</div>
<div class="relative flex justify-center text-xs uppercase">
<span class="bg-[#1E293B] px-4 text-[#64748B] font-medium tracking-widest">Ou continuer avec</span>
</div>
</div>
<!-- Social Login -->
<div class="grid grid-cols-1 gap-4">
<button class="flex items-center justify-center gap-3 w-full py-3 px-4 bg-[#1E293B] border border-[#334155] rounded-xl text-[#CBD5E1] font-medium hover:bg-[#334155] active:scale-[0.98] transition-all">
<svg class="w-5 h-5" viewbox="0 0 24 24">
<path d="M22.56 12.25c0-.78-.07-1.53-.2-2.25H12v4.26h5.92c-.26 1.37-1.04 2.53-2.21 3.31v2.77h3.57c2.08-1.92 3.28-4.74 3.28-8.09z" fill="currentColor"></path>
<path d="M12 23c2.97 0 5.46-.98 7.28-2.66l-3.57-2.77c-.98.66-2.23 1.06-3.71 1.06-2.86 0-5.29-1.93-6.16-4.53H2.18v2.84C3.99 20.53 7.7 23 12 23z" fill="#34A853"></path>
<path d="M5.84 14.09c-.22-.66-.35-1.36-.35-2.09s.13-1.43.35-2.09V7.07H2.18C1.43 8.55 1 10.22 1 12s.43 3.45 1.18 4.93l2.85-2.22.81-.62z" fill="#FBBC05"></path>
<path d="M12 5.38c1.62 0 3.06.56 4.21 1.64l3.15-3.15C17.45 2.09 14.97 1 12 1 7.7 1 3.99 3.47 2.18 7.07l3.66 2.84c.87-2.6 3.3-4.53 6.16-4.53z" fill="#EA4335"></path>
</svg>
                    Google
                </button>
</div>
</div>
<!-- Footer Link -->
<p class="mt-8 text-center font-body-md text-body-md text-[#94A3B8]">
            Pas encore de compte ? 
            <a class="text-[#818CF8] font-semibold hover:underline ml-1" href="#">Créer un compte</a>
</p>
</main>
<!-- Contextual Micro-interactions -->
<script>
        // Simple input focus effects and password visibility toggle
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.classList.remove('scale-[1.01]');
            });
        });

        const togglePass = document.querySelector('button[type="button"]');
        const passInput = document.getElementById('password');
        if (togglePass && passInput) {
            togglePass.addEventListener('click', () => {
                const isPass = passInput.type === 'password';
                passInput.type = isPass ? 'text' : 'password';
                togglePass.children[0].textContent = isPass ? 'visibility_off' : 'visibility';
            });
        }
    </script>
</body></html>
