<body class="bg-background text-on-surface min-h-screen flex flex-col items-center">
<!-- TopAppBar -->
<header class="bg-surface dark:bg-on-background text-primary dark:text-primary-fixed-dim flex justify-between items-center px-container-margin py-md w-full sticky top-0 z-40">
<button class="material-symbols-outlined text-primary hover:bg-surface-container-low transition-colors p-2 rounded-full" data-icon="close">close</button>
<h1 class="text-headline-lg font-headline-lg font-bold text-primary dark:text-primary-fixed-dim">Presencia</h1>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-fixed">
<img alt="Profile" class="w-full h-full object-cover" data-alt="A professional close-up portrait of a young male youth leader with a warm and welcoming smile. He is in a brightly lit, modern indoor setting with soft natural light. The aesthetic is clean and high-key, mirroring the brand's warm terracotta and off-white color palette. The background is a soft-focus interior of a community space." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBwK0qODAoi-JLxoMjnkL-4RNhTNcyskZBMS57ObdptfVg7RlVwAgdikIrYrMhoBmJu9m3309fAtDeT46qmrzH5BCaeZP5kdp1n--CmibzxhPDIm743QRfjRBEyVJa3yK5PsuonujZzDjIiXhj_8IJuhDjeiL82l3QnZNZhYBsoSYjbBdJSJx-N1X1fZnT89GJgIHWliZU31nHeiZo8zkLNYUZSQ9TgA1Aro8IYUd9z-xQIrQ7-eVpN2wDWDBOL8iriTASzXlJ8-g"/>
</div>
</header>
<main class="flex-1 w-full max-w-md px-container-margin py-xl flex flex-col gap-lg">
<!-- Header Text -->
<div class="space-y-sm">
<h2 class="text-display-lg font-display-lg text-on-surface">Inviter un collaborateur</h2>
<p class="text-body-lg font-body-lg text-on-surface-variant">Ajoutez un nouveau moniteur pour vous aider à gérer la présence des jeunes.</p>
</div>
<!-- Illustration Card (Bento Style) -->
<div class="relative w-full h-48 rounded-xl overflow-hidden shadow-[0_4px_12px_rgba(122,99,88,0.08)] bg-surface-container">
<div class="absolute inset-0 bg-gradient-to-br from-primary/20 to-secondary/10"></div>
<img alt="Collaboration" class="w-full h-full object-cover mix-blend-overlay opacity-60" data-alt="A group of diverse young adults sitting together in a modern, warm-toned café environment, collaborating and talking. The scene is bathed in golden hour sunlight, highlighting the warm terracotta and earthy brown tones of the design system. The atmosphere is communal and supportive, emphasizing 'Radical Hospitality' and shared leadership in a church setting." src="https://lh3.googleusercontent.com/aida-public/AB6AXuB8790UOjh4eY3C2Tjddrdl-HZXW8FpOkT-pthcMnLyiUsDWglF6sahO_Tqpu2m5_hGkDCYBbnGROa_Snb7l7jeAGhNXMaeH7totlYPvXXS19FhRcal_YYUlF5ij9JQWnPEJz4N2RaOEjbSFAc9VHUqCAYYGRxk6N1cyj937x-6pllpsHEkVe8J7-dLfME2WTdHxE-eJfhcYunmh9CosXLoLlnaDW07qNjOkeJioBdiyUi2Rr6n0S1y8cCf0ApXkUT5twwlKsA6VA"/>
<div class="absolute bottom-md left-md">
<span class="bg-primary text-on-primary px-sm py-xs rounded-lg text-label-md font-label-md flex items-center gap-xs">
<span class="material-symbols-outlined text-[16px]">group_add</span>
                    Nouveau Moniteur
                </span>
</div>
</div>
<!-- Invitation Form -->
<form class="flex flex-col gap-lg">
<!-- Email Input -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant ml-sm" for="email">Adresse e-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-xl pr-md py-md bg-surface-container-lowest border-outline-variant rounded-xl focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all text-body-lg placeholder:text-outline-variant shadow-sm" id="email" placeholder="moniteur@exemple.com" type="email"/>
</div>
</div>
<!-- Role Selector -->
<div class="space-y-sm">
<label class="text-label-md font-label-md text-on-surface-variant ml-sm">Rôle du collaborateur</label>
<div class="grid grid-cols-1 gap-md">
<!-- Administrator Option -->
<label class="relative flex items-center p-md bg-surface-container-lowest border-2 border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20 rounded-xl cursor-pointer transition-all shadow-sm group">
<input checked="" class="hidden peer" name="role" type="radio" value="admin"/>
<div class="flex flex-col flex-1">
<span class="text-headline-md font-headline-md text-on-surface">Administrateur</span>
<span class="text-body-md font-body-md text-on-surface-variant">Accès complet, peut gérer les membres et les sessions.</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-3 h-3 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</label>
<!-- Reader Option -->
<label class="relative flex items-center p-md bg-surface-container-lowest border-2 border-transparent has-[:checked]:border-primary has-[:checked]:bg-primary-fixed/20 rounded-xl cursor-pointer transition-all shadow-sm group">
<input class="hidden peer" name="role" type="radio" value="reader"/>
<div class="flex flex-col flex-1">
<span class="text-headline-md font-headline-md text-on-surface">Lecteur</span>
<span class="text-body-md font-body-md text-on-surface-variant">Peut consulter les listes et marquer les présences uniquement.</span>
</div>
<div class="w-6 h-6 rounded-full border-2 border-outline peer-checked:border-primary flex items-center justify-center transition-colors">
<div class="w-3 h-3 rounded-full bg-primary scale-0 peer-checked:scale-100 transition-transform"></div>
</div>
</label>
</div>
</div>
<!-- Submit Button -->
<button class="w-full bg-primary text-on-primary py-lg rounded-xl text-headline-md font-headline-md shadow-lg shadow-primary/20 hover:bg-primary-container transition-all active:scale-95 flex items-center justify-center gap-sm mt-md" type="submit">
<span class="material-symbols-outlined">send</span>
                Envoyer l'invitation
            </button>
</form>
</main>
<!-- Success Feedback Overlay (Hidden by default) -->
<div class="fixed inset-0 bg-inverse-surface/40 backdrop-blur-sm z-50 flex items-center justify-center p-xl hidden opacity-0 transition-opacity duration-300" id="success-overlay">
<div class="bg-surface-container-lowest p-xl rounded-2xl max-w-sm w-full text-center flex flex-col items-center gap-md shadow-2xl">
<div class="w-16 h-16 bg-primary-fixed rounded-full flex items-center justify-center">
<span class="material-symbols-outlined text-primary text-[40px]" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</div>
<div class="space-y-xs">
<h3 class="text-headline-lg font-headline-lg text-on-surface">Invitation envoyée !</h3>
<p class="text-body-md font-body-md text-on-surface-variant">Le collaborateur recevra un e-mail pour rejoindre votre équipe.</p>
</div>
<button class="w-full bg-surface-container-high text-on-surface py-md rounded-xl font-bold hover:bg-surface-container-highest transition-colors" onclick="hideSuccess()">
                Terminer
            </button>
</div>
</div>
<!-- Bottom Navigation Shell (Suppressed for this task-focused screen per mandate) -->
<!-- However, we ensure the background and spacing remain consistent -->
<script>
        const form = document.querySelector('form');
        const overlay = document.getElementById('success-overlay');

        form.addEventListener('submit', (e) => {
            e.preventDefault();
            // Interaction logic for demo
            overlay.classList.remove('hidden');
            setTimeout(() => {
                overlay.classList.remove('opacity-0');
            }, 10);
        });

        function hideSuccess() {
            overlay.classList.add('opacity-0');
            setTimeout(() => {
                overlay.classList.add('hidden');
            }, 300);
        }

        // Micro-interactions for form labels
        const inputs = document.querySelectorAll('input[type="email"]');
        inputs.forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('.material-symbols-outlined').classList.remove('text-primary');
            });
        });
    </script>
</body></html>
