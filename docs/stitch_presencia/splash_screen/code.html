<style>
        body {
            background-color: #fff8f6; /* surface-bright */
            margin: 0;
            padding: 0;
            overflow: hidden;
            font-family: 'Inter', sans-serif;
        }

        .splash-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            width: 100vw;
            position: relative;
        }

        .logo-animation {
            animation: heartBeat 2.5s ease-in-out infinite;
        }

        @keyframes heartBeat {
            0% { transform: scale(1); opacity: 0.9; }
            14% { transform: scale(1.1); opacity: 1; }
            28% { transform: scale(1); opacity: 0.9; }
            42% { transform: scale(1.1); opacity: 1; }
            70% { transform: scale(1); opacity: 0.9; }
        }

        .fade-in {
            animation: fadeIn 1.2s ease-out forwards;
        }

        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .loader-bar {
            width: 140px;
            height: 3px;
            background-color: #f0dfd8; /* surface-variant */
            border-radius: 9999px;
            overflow: hidden;
            position: absolute;
            bottom: 64px;
        }

        .loader-progress {
            width: 40%;
            height: 100%;
            background-color: #a13a15; /* primary */
            border-radius: 9999px;
            animation: loadingProgress 1.8s infinite ease-in-out;
        }

        @keyframes loadingProgress {
            0% { transform: translateX(-100%); }
            100% { transform: translateX(300%); }
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>

<body class="bg-surface-bright">
<div class="splash-container">

<span class="material-symbols-outlined text-[64px] text-white select-none" data-icon="favorite" style="font-variation-settings: 'FILL' 1;">favorite</span>
</div>

<h1 class="font-display-lg text-display-lg text-primary tracking-tight">Presencia</h1>
<p class="font-body-md text-body-md text-on-surface-variant opacity-70 mt-xs">L'hospitalité radicale</p>
</div>
</div>
<!-- Subtle Background Decorative Element -->

<div class="absolute -top-[10%] -left-[10%] w-[40%] h-[40%] rounded-full bg-primary-fixed-dim blur-[120px]"></div>
<div class="absolute -bottom-[10%] -right-[10%] w-[50%] h-[50%] rounded-full bg-secondary-fixed-dim blur-[140px]"></div>
</div>
<!-- Discret Loading Indicator -->
<div class="loader-bar">
<div class="loader-progress"></div>
</div>
<!-- Tagline/Footer (Optional but elegant) -->
<div class="absolute bottom-sm text-center fade-in" style="animation-delay: 0.5s;">
<p class="font-label-sm text-label-sm text-outline-variant uppercase tracking-[0.2em]">Service de Communauté</p>
</div>
</div>
<script>
        // Interactive splash effect: Subtle mouse movement influence
        document.addEventListener('mousemove', (e) => {
            const container = document.querySelector('.splash-container');
            const moveX = (e.clientX - window.innerWidth / 2) / 50;
            const moveY = (e.clientY - window.innerHeight / 2) / 50;
            
            const logo = document.querySelector('.logo-animation');
            logo.style.transform = `translate(${moveX}px, ${moveY}px)`;
        });

        // Simulating a navigation delay to the dashboard
        // In a real app, this would check authentication and load assets
        window.addEventListener('load', () => {
            setTimeout(() => {

        });
