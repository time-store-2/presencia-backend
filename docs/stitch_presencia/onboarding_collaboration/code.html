<script>
        // Simple Interaction Logic
        document.querySelector('button.bg-primary').addEventListener('click', () => {
            // Trigger a transition out before navigating
            document.body.style.opacity = '0';
            document.body.style.transition = 'opacity 0.4s ease-out';
            setTimeout(() => {
                // Potential navigation logic would go here
                console.log("Navigating to step 3/3");
            }, 400);
        });

        // Hover effect for the skip button
        const skipBtn = document.querySelector('.text-on-surface-variant');
        skipBtn.addEventListener('mouseenter', () => {
            skipBtn.style.transform = 'translateX(2px)';
            skipBtn.style.transition = 'transform 0.2s ease-out';
        });
        skipBtn.addEventListener('mouseleave', () => {
            skipBtn.style.transform = 'translateX(0)';
        });
    </script>
