<style>
        body {
            background-color: #fff8f6;
            color: #221a16;
            font-family: 'Inter', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .reason-card.active {
            border-color: #a13a15;
            background-color: #ffdbd0;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background min-h-screen pb-32">
<!-- TopAppBar -->
<header class="fixed top-0 w-full z-50 bg-surface dark:bg-surface-dim shadow-[0_4px_12px_rgba(122,99,88,0.08)] flex items-center justify-between px-container-margin h-16 w-full">
<div class="flex items-center gap-4">
<button class="active:scale-95 transition-transform duration-200 hover:bg-surface-container-low p-2 rounded-full" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-primary">Justifier une Absence</h1>
</div>
<div class="flex items-center">
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-fixed">
<img alt="Admin Profile" class="w-full h-full object-cover" data-alt="A professional portrait of a smiling young adult mentor in a brightly lit, warm modern office environment. The lighting is soft and natural, emphasizing a welcoming and empathetic personality. The background features warm earthy tones and soft textures consistent with a radical hospitality church environment." src="https://lh3.googleusercontent.com/aida-public/AB6AXuC4Wx8AltHAvipud4yFtYdlqsb8l1akz8qH-T4FkZSWIGdV16gCC7KHSH9IYPkcPki2EzbLVWgYRyrn7GIYkWE11efkOuxSnScQx7NJzTYJsMza4BRdtWiRZBMiixZQKF49xNYQJYyRC_K3vPWro9mcXTvRDPxbV1Qn6D_ZUNVrUQJMfBf0j4xoUBzTLtwYw3zPBMw_pZ3vIfmDUdUtXxrXc6MOCFwPHbd1y3ighWFR890S7ZNdS8PeKol70SEje3YLsbpuDmUYQg"/>
</div>
</div>
</header>
<main class="mt-20 px-container-margin max-w-2xl mx-auto space-y-lg">
<!-- Context Card -->
<section class="bg-surface-container-low rounded-xl p-md flex items-center gap-md shadow-sm">
<div class="relative">
<div class="w-16 h-16 rounded-full overflow-hidden bg-primary-fixed">
<img alt="David Koffi" class="w-full h-full object-cover" data-alt="A close-up portrait of David Koffi, a friendly teenage boy with a kind expression. The photograph is taken in a soft-focus outdoor park during the golden hour, creating a warm and communal atmosphere. The lighting is gentle and flattering, highlighting his features with professional clarity and high-end aesthetic appeal." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBKMhyuivN8QbWG1QttwS0WC--j93i9yHyIMw808KmRKbc9m_1dOTixWGLbRx_eeDwgNZYoUtuF9Gtf941k4n18Ei4qZNQwD7yAXfM75G0hCPYiGvSBbKKijk_cWN_QC2lT3jgV1Ksp135a5fvgNlJQjjIozoPtb99nmHvO_tdcSMLJVQOEY5BafDHn73aAx79ltWugyHgCQl42xJhaSaoQEW60oWRxfj0AKvUpHwUIAqAVq2kMdOE1ObimONTYowqoJ_f1n2V3Rw"/>
</div>
<div class="absolute -bottom-1 -right-1 bg-error rounded-full p-1 border-2 border-surface-container-low">
<span class="material-symbols-outlined text-[14px] text-white" style="font-variation-settings: 'FILL' 1;">event_busy</span>
</div>
</div>
<div>
<h2 class="font-headline-md text-headline-md text-on-surface">David Koffi</h2>
<p class="font-body-md text-text-on-surface-variant">Absence du Dimanche 12 Mai 2024</p>
<div class="inline-flex items-center px-2 py-0.5 mt-1 rounded-full bg-[#FDECEA] text-[#C0392B] font-label-sm text-label-sm">
                    Non justifiée
                </div>
</div>
</section>
<!-- Reason Selection -->
<section class="space-y-md">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Motif de l'absence</h3>
<div class="grid grid-cols-2 gap-md">
<!-- Sick -->
<button class="reason-card flex flex-col items-center justify-center p-md bg-surface rounded-xl border-2 border-outline-variant hover:border-primary transition-all group active:scale-95 duration-150" onclick="selectReason(this)">
<span class="material-symbols-outlined text-primary text-3xl mb-sm group-hover:scale-110 transition-transform">medical_services</span>
<span class="font-label-md text-label-md">Maladie</span>
</button>
<!-- Travel -->
<button class="reason-card flex flex-col items-center justify-center p-md bg-surface rounded-xl border-2 border-outline-variant hover:border-primary transition-all group active:scale-95 duration-150" onclick="selectReason(this)">
<span class="material-symbols-outlined text-primary text-3xl mb-sm group-hover:scale-110 transition-transform">flight_takeoff</span>
<span class="font-label-md text-label-md">Voyage</span>
</button>
<!-- Family -->
<button class="reason-card flex flex-col items-center justify-center p-md bg-surface rounded-xl border-2 border-outline-variant hover:border-primary transition-all group active:scale-95 duration-150" onclick="selectReason(this)">
<span class="material-symbols-outlined text-primary text-3xl mb-sm group-hover:scale-110 transition-transform">family_restroom</span>
<span class="font-label-md text-label-md">Évènement familial</span>
</button>
<!-- School -->
<button class="reason-card flex flex-col items-center justify-center p-md bg-surface rounded-xl border-2 border-outline-variant hover:border-primary transition-all group active:scale-95 duration-150" onclick="selectReason(this)">
<span class="material-symbols-outlined text-primary text-3xl mb-sm group-hover:scale-110 transition-transform">school</span>
<span class="font-label-md text-label-md">École / Études</span>
</button>
</div>
</section>
<!-- Additional Notes -->
<section class="space-y-md">
<div class="flex items-center justify-between">
<h3 class="font-label-md text-label-md text-on-surface-variant uppercase tracking-wider">Notes complémentaires</h3>
<span class="font-label-sm text-label-sm text-on-surface-variant" id="charCount">0 / 200</span>
</div>
<div class="relative group">
<textarea class="w-full h-32 p-md bg-surface border-2 border-outline-variant rounded-xl focus:border-primary focus:ring-0 font-body-md text-body-md text-on-surface resize-none transition-colors" id="notes" maxlength="200" oninput="updateCharCount(this)" placeholder="Précisez les détails si nécessaire..."></textarea>
<div class="absolute bottom-3 right-3 text-outline-variant group-focus-within:text-primary transition-colors">
<span class="material-symbols-outlined">edit_note</span>
</div>
</div>
</section>
<!-- Confirmation Action -->
<section class="pt-lg">
<button class="w-full bg-primary text-on-primary py-4 rounded-xl font-headline-md text-headline-md shadow-lg active:scale-[0.98] transition-all flex items-center justify-center gap-sm" onclick="submitJustification()">
<span>Confirmer la justification</span>
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">check_circle</span>
</button>
<p class="text-center font-label-sm text-label-sm text-on-surface-variant mt-md">Une notification sera envoyée aux responsables du groupe.</p>
</section>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 w-full z-50 rounded-t-xl bg-surface/80 dark:bg-surface-dim/80 backdrop-blur-md shadow-[0_-4px_12px_rgba(122,99,88,0.08)] flex justify-around items-center px-4 py-2 w-full h-20">
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">home</span>
<span class="font-label-sm text-label-sm">Accueil</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">group</span>
<span class="font-label-sm text-label-sm">Jeunes</span>
</a>
<a class="flex flex-col items-center justify-center bg-primary-container dark:bg-primary-container text-on-primary-container rounded-full px-4 py-1" href="#">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">how_to_reg</span>
<span class="font-label-sm text-label-sm">Présence</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">forum</span>
<span class="font-label-sm text-label-sm">Groupes</span>
</a>
<a class="flex flex-col items-center justify-center text-on-surface-variant dark:text-on-surface-variant opacity-70 hover:opacity-100 transition-opacity" href="#">
<span class="material-symbols-outlined">settings</span>
<span class="font-label-sm text-label-sm">Réglages</span>
</a>
</nav>
<script>
        let selectedElement = null;

        function selectReason(element) {
            if (selectedElement) {
                selectedElement.classList.remove('active');
            }
            element.classList.add('active');
            selectedElement = element;
            
            // Haptic feedback simulation
            if (window.navigator && window.navigator.vibrate) {
                window.navigator.vibrate(5);
            }
        }

        function updateCharCount(textarea) {
            const count = textarea.value.length;
            document.getElementById('charCount').textContent = `${count} / 200`;
        }

        function submitJustification() {
            if (!selectedElement) {
                alert('Veuillez sélectionner un motif pour l\'absence.');
                return;
            }

            const button = event.currentTarget;
            button.innerHTML = '<span class="material-symbols-outlined animate-spin">sync</span><span>Enregistrement...</span>';
            button.disabled = true;
            button.classList.add('opacity-80');

            setTimeout(() => {
                button.innerHTML = '<span class="material-symbols-outlined">done_all</span><span>Justifié avec succès !</span>';
                button.classList.remove('bg-primary');
                button.classList.add('bg-[#2D7A56]');
                
                setTimeout(() => {
                    alert('La justification pour David Koffi a été enregistrée.');
                    history.back();
                }, 1000);
            }, 1500);
        }
    </script>
</body></html>
