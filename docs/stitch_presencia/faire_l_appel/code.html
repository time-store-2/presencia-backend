<script>
        // Micro-interaction for status pills
        document.querySelectorAll('.status-pill').forEach(pill => {
            pill.addEventListener('click', function() {
                const parent = this.parentElement;
                const siblings = parent.querySelectorAll('.status-pill');
                
                // Clear all active states in this row
                siblings.forEach(s => {
                    s.classList.remove('font-bold', 'bg-[#EAF5EF]', 'text-[#2D7A56]', 'border-[#2D7A56]', 'bg-[#FDECEA]', 'text-[#C0392B]', 'border-[#C0392B]', 'bg-[#FEF3C7]', 'text-[#D97706]', 'border-[#D97706]', 'bg-[#F0EBF8]', 'text-[#6B4CAE]', 'border-[#6B4CAE]', 'border-2');
                    s.classList.add('border-outline-variant', 'text-on-surface-variant', 'border');
                });

                // Apply active state based on title
                const type = this.getAttribute('title');
                this.classList.remove('border-outline-variant', 'text-on-surface-variant', 'border');
                this.classList.add('font-bold', 'border-2');

                if (type === 'Présent') {
                    this.classList.add('bg-[#EAF5EF]', 'text-[#2D7A56]', 'border-[#2D7A56]');
                } else if (type === 'Absent') {
                    this.classList.add('bg-[#FDECEA]', 'text-[#C0392B]', 'border-[#C0392B]');
                } else if (type === 'Retard') {
                    this.classList.add('bg-[#FEF3C7]', 'text-[#D97706]', 'border-[#D97706]');
                } else if (type === 'Excusé') {
                    this.classList.add('bg-[#F0EBF8]', 'text-[#6B4CAE]', 'border-[#6B4CAE]');
                }
            });
        });

        // Search highlight interaction
        const searchInput = document.querySelector('input[type="text"]');
        searchInput.addEventListener('focus', () => {
            searchInput.parentElement.classList.add('scale-[1.01]');
            searchInput.parentElement.style.transition = 'all 0.3s ease';
        });
        searchInput.addEventListener('blur', () => {
            searchInput.parentElement.classList.remove('scale-[1.01]');
        });
    </script>
