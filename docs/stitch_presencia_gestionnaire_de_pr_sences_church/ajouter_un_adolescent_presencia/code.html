<!DOCTYPE html>

<html class="light" lang="fr"><head>

                    "tertiary": "#005338",
                    "error-container": "#ffdad6",
                    "on-primary-container": "#dad7ff",
                    "inverse-surface": "#2e3132",
                    "on-primary-fixed": "#0f0069",
                    "surface-container-highest": "#e1e3e4",
                    "primary-fixed-dim": "#c3c0ff",
                    "error": "#ba1a1a",
                    "secondary-container": "#6063ee",
                    "surface-container-lowest": "#ffffff",
                    "surface-variant": "#e1e3e4",
                    "on-tertiary-fixed-variant": "#005236",
                    "on-tertiary-fixed": "#002113",
                    "on-error-container": "#93000a",
                    "surface-bright": "#f8f9fa",
                    "secondary": "#4648d4",
                    "on-surface-variant": "#464555",
                    "background": "#f8f9fa",
                    "surface-dim": "#d9dadb",
                    "surface": "#f8f9fa",

                    "on-secondary-fixed-variant": "#2f2ebe",
                    "surface-container-high": "#e7e8e9",
                    "on-secondary-container": "#fffbff",
                    "on-tertiary": "#ffffff",
                    "on-background": "#191c1d",
                    "tertiary-fixed-dim": "#4edea3",
                    "inverse-primary": "#c3c0ff",
                    "on-primary": "#ffffff",

            "borderRadius": {

            "fontFamily": {

                    "display": ["32px", {"lineHeight": "40px", "letterSpacing": "-0.02em", "fontWeight": "700"}],
                    "label-md": ["12px", {"lineHeight": "16px", "letterSpacing": "0.5px", "fontWeight": "500"}]
            }
          },
        },
      }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; -webkit-tap-highlight-color: transparent; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .active-toggle {
            background-color: #4f46e5;
            color: #ffffff;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-background min-h-screen pb-24">
<!-- TopAppBar Structure from JSON -->
<header class="bg-surface shadow-sm sticky top-0 z-50 flex justify-between items-center w-full px-container-padding h-16">
<div class="flex items-center gap-4">
<button class="p-2 hover:bg-surface-container-high transition-colors rounded-full active:scale-95 duration-100" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Nouvel adolescent</h1>
</div>
<div class="w-10 h-10 rounded-full bg-surface-container-high overflow-hidden border border-outline-variant">
<img alt="Admin" class="w-full h-full object-cover" src="https://lh3.googleusercontent.com/aida-public/AB6AXuCUCQz5jB9MJHWRqTf2a872ln78-Bc7naIHbK4xabNTTP6v3mC1j-afYksU31IMon6ZuOFfk1Vi7kZLfZH2yq4FEh9kkYfuDX2YvsMJBFRr3Xq8PXBS9E6AO0Jh0_MuLS5JoBGoL7fJ96clxCPsXsffuPi6GWn6mK3T4V6B56hbcgFDYP8PqZG93ujycIDkfeRKUBOGeK4e6fsfRhGyha1K2sO1NIKjTRa3llhnIj0SAlyMrxgH2M7ifHp5p28_QaiJ-qb9d0r7jks"/>
</div>
</header>
<main class="max-w-md mx-auto px-container-padding pt-8">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center mb-8">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-highest border-2 border-dashed border-outline flex flex-col items-center justify-center text-on-surface-variant overflow-hidden cursor-pointer hover:bg-surface-variant transition-all">
<span class="material-symbols-outlined text-4xl mb-1">add_a_photo</span>
<span class="font-label-md text-label-md px-4 text-center">Ajouter une photo</span>
</div>
<div class="absolute bottom-0 right-0 bg-primary p-2 rounded-full text-on-primary shadow-md border-2 border-white">
<span class="material-symbols-outlined text-sm" style="font-variation-settings: 'FILL' 1;">edit</span>
</div>
</div>
</section>
<!-- Form Sections -->
<form class="space-y-8" id="add-teen-form">
<!-- Informations personnelles -->
<div class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl">person</span>
<h2 class="font-title-lg text-title-lg">Informations personnelles</h2>
</div>
<div class="space-y-4 bg-white p-4 rounded-xl border border-outline-variant shadow-sm">
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Prénom</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Ex: Jean" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Nom</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Ex: Dupont" type="text"/>
</div>
<div class="space-y-2">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Sexe</label>
<div class="flex p-1 bg-surface-container-low rounded-xl border border-outline-variant">
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all active-toggle" id="gender-M" onclick="setGender('M')" type="button">Masculin</button>
<button class="flex-1 py-2 rounded-lg font-label-lg text-label-lg transition-all text-on-surface-variant" id="gender-F" onclick="setGender('F')" type="button">Féminin</button>
</div>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Date de naissance</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" type="date"/>
</div>
</div>
</div>
<!-- Parent / Tuteur -->
<div class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl">family_restroom</span>
<h2 class="font-title-lg text-title-lg">Parent / Tuteur</h2>
</div>
<div class="space-y-4 bg-white p-4 rounded-xl border border-outline-variant shadow-sm">
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Nom du parent</label>
<input class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="Ex: Marie Dupont" type="text"/>
</div>
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Téléphone</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-3 top-1/2 -translate-y-1/2 text-outline">call</span>
<input class="w-full pl-10 pr-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none transition-all" placeholder="06 12 34 56 78" type="tel"/>
</div>
</div>
</div>
</div>
<!-- Groupe -->
<div class="space-y-4">
<div class="flex items-center gap-2 mb-2">
<span class="material-symbols-outlined text-primary text-xl">groups</span>
<h2 class="font-title-lg text-title-lg">Groupe</h2>
</div>
<div class="space-y-4 bg-white p-4 rounded-xl border border-outline-variant shadow-sm">
<div class="space-y-1">
<label class="font-label-lg text-label-lg text-on-surface-variant ml-1">Sélectionner un groupe</label>
<div class="relative">
<select class="w-full px-4 py-3 rounded-xl border border-outline-variant focus:border-primary focus:ring-1 focus:ring-primary outline-none appearance-none transition-all bg-white">
<option disabled="" selected="" value="">Choisir un groupe...</option>
<option value="1">Groupe Alpha (12-14 ans)</option>
<option value="2">Groupe Beta (15-17 ans)</option>
<option value="3">Groupe Scouts - Paris Centre</option>
<option value="4">Section Sportive</option>
</select>
<span class="material-symbols-outlined absolute right-3 top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</div>
</div>
</form>
<!-- Spacer for FAB area -->
<div class="h-20"></div>
</main>
<!-- Fixed Bottom Button -->
<div class="fixed bottom-0 left-0 w-full p-4 bg-background/80 backdrop-blur-md z-40 border-t border-outline-variant lg:max-w-md lg:left-1/2 lg:-translate-x-1/2 lg:bg-transparent lg:border-none">
<button class="w-full py-4 bg-primary text-on-primary rounded-xl font-label-lg text-label-lg shadow-lg active:scale-95 transition-all flex items-center justify-center gap-2" form="add-teen-form" type="submit">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Enregistrer l'adolescent
        </button>
</div>
<!-- Hidden Success Modal / Toast Interaction logic -->
<div class="fixed bottom-24 left-1/2 -translate-x-1/2 bg-on-surface text-surface px-6 py-3 rounded-full font-label-md text-label-md shadow-xl opacity-0 translate-y-4 transition-all duration-300 pointer-events-none" id="success-toast">
        Adolescent enregistré avec succès !
    </div>
<script>
        function setGender(type) {
            const btnM = document.getElementById('gender-M');
            const btnF = document.getElementById('gender-F');
            
            if (type === 'M') {
                btnM.classList.add('active-toggle');
                btnM.classList.remove('text-on-surface-variant');
                btnF.classList.remove('active-toggle');
                btnF.classList.add('text-on-surface-variant');
            } else {
                btnF.classList.add('active-toggle');
                btnF.classList.remove('text-on-surface-variant');
                btnM.classList.remove('active-toggle');
                btnM.classList.add('text-on-surface-variant');
            }
        }

        document.getElementById('add-teen-form').addEventListener('submit', function(e) {
            e.preventDefault();
            const toast = document.getElementById('success-toast');
            toast.classList.remove('opacity-0', 'translate-y-4');
            toast.classList.add('opacity-100', 'translate-y-0');
            
            setTimeout(() => {
                toast.classList.add('opacity-0', 'translate-y-4');
                toast.classList.remove('opacity-100', 'translate-y-0');
                // Normally redirect after success
                // window.location.href = '/adolescents';
            }, 3000);
        });
    </script>
</body></html>
