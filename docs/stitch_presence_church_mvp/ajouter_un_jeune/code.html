<!DOCTYPE html>

<html class="light" lang="fr"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0, viewport-fit=cover" name="viewport"/>
<title>Ajouter un adolescent</title>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;700;800&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .input-focus-effect:focus-within {
            border-color: #0f5238;
            box-shadow: 0 0 0 1px #0f5238;
        }
        /* Custom scrollbar for mobile feel */
        ::-webkit-scrollbar {
            width: 0px;
            background: transparent;
        }
    </style>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "secondary-fixed": "#cfe9d8",
                        "outline": "#707973",
                        "primary-fixed-dim": "#95d4b3",
                        "on-error-container": "#93000a",
                        "tertiary-container": "#8d4d4e",
                        "surface-container": "#eceeea",
                        "surface-container-highest": "#e1e3df",
                        "error-container": "#ffdad6",
                        "background": "#f8faf6",
                        "on-primary-fixed-variant": "#0e5138",
                        "on-tertiary-fixed": "#390b0e",
                        "on-tertiary-fixed-variant": "#6f3537",
                        "inverse-on-surface": "#eff1ed",
                        "surface-variant": "#e1e3df",
                        "surface-container-low": "#f2f4f0",
                        "inverse-surface": "#2e312f",
                        "inverse-primary": "#95d4b3",
                        "on-primary-fixed": "#002114",
                        "secondary-container": "#cfe9d8",
                        "surface": "#f8faf6",
                        "on-secondary": "#ffffff",
                        "surface-bright": "#f8faf6",
                        "on-tertiary": "#ffffff",
                        "on-primary-container": "#a8e7c5",
                        "on-primary": "#ffffff",
                        "on-error": "#ffffff",
                        "on-background": "#191c1a",
                        "on-surface-variant": "#404943",
                        "secondary-fixed-dim": "#b3ccbd",
                        "surface-container-high": "#e7e9e5",
                        "on-secondary-fixed": "#092016",
                        "secondary": "#4c6357",
                        "tertiary-fixed": "#ffdad9",
                        "outline-variant": "#bfc9c1",
                        "on-surface": "#191c1a",
                        "on-tertiary-container": "#ffcfce",
                        "surface-dim": "#d8dbd7",
                        "primary-fixed": "#b1f0ce",
                        "error": "#ba1a1a",
                        "on-secondary-fixed-variant": "#354c3f",
                        "on-secondary-container": "#526a5c",
                        "primary": "#0f5238",
                        "tertiary": "#713638",
                        "surface-tint": "#2c694e",
                        "surface-container-lowest": "#ffffff",
                        "tertiary-fixed-dim": "#ffb3b3",
                        "primary-container": "#2d6a4f"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "sm": "8px",
                        "margin-mobile": "20px",
                        "xl": "32px",
                        "lg": "24px",
                        "xs": "4px",
                        "md": "16px",
                        "gutter": "16px",
                        "unit": "4px",
                        "margin-desktop": "40px"
                    },
                    "fontFamily": {
                        "headline-lg": ["Plus Jakarta Sans"],
                        "body-md": ["Plus Jakarta Sans"],
                        "display": ["Plus Jakarta Sans"],
                        "body-lg": ["Plus Jakarta Sans"],
                        "label-md": ["Plus Jakarta Sans"],
                        "headline-md": ["Plus Jakarta Sans"],
                        "label-bold": ["Plus Jakarta Sans"],
                        "headline-lg-mobile": ["Plus Jakarta Sans"]
                    },
                    "fontSize": {
                        "headline-lg": ["24px", {"lineHeight": "1.3", "fontWeight": "700"}],
                        "body-md": ["14px", {"lineHeight": "1.5", "fontWeight": "400"}],
                        "display": ["32px", {"lineHeight": "1.2", "letterSpacing": "-0.02em", "fontWeight": "800"}],
                        "body-lg": ["16px", {"lineHeight": "1.6", "fontWeight": "400"}],
                        "label-md": ["12px", {"lineHeight": "1.2", "fontWeight": "500"}],
                        "headline-md": ["20px", {"lineHeight": "1.4", "fontWeight": "700"}],
                        "label-bold": ["12px", {"lineHeight": "1.2", "letterSpacing": "0.05em", "fontWeight": "700"}],
                        "headline-lg-mobile": ["22px", {"lineHeight": "1.3", "fontWeight": "700"}]
                    }
                },
            },
        }

<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
  </head>
<body class="bg-background text-on-surface min-h-screen pb-32">
<!-- Header (TopAppBar Contextual for Sub-page) -->
<header class="sticky top-0 z-40 bg-surface flex items-center px-margin-mobile py-md h-16">
<button aria-label="Retour" class="mr-4 p-1 hover:bg-surface-container-low rounded-full transition-colors active:scale-90">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="text-[17px] font-bold leading-none">Nouvel adolescent</h1>
</header>
<main class="max-w-2xl mx-auto px-margin-mobile pt-lg space-y-xl">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center">
<div class="relative group cursor-pointer">
<div class="w-20 h-20 bg-surface-container-high rounded-full flex items-center justify-center overflow-hidden border-2 border-white shadow-sm">
<span class="material-symbols-outlined text-outline text-display opacity-40">person</span>
<!-- Camera Overlay -->
<div class="absolute inset-0 bg-black/10 flex items-center justify-center opacity-0 group-hover:opacity-100 transition-opacity">
<span class="material-symbols-outlined text-white" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</div>
</div>
<div class="absolute -bottom-1 -right-1 bg-primary text-white rounded-full p-1 border-2 border-white">
<span class="material-symbols-outlined text-[16px]">add</span>
</div>
</div>
<p class="mt-sm font-label-md text-label-md text-primary font-medium">Ajouter une photo</p>
</section>
<!-- Form Section: INFORMATIONS -->
<section class="space-y-lg">
<h2 class="font-label-bold text-label-bold text-outline uppercase tracking-widest">Informations</h2>
<div class="space-y-md">
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Prénom -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Prénom</label>
<input class="w-full h-12 px-md bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all placeholder:text-outline-variant" placeholder="Ex: Jean" type="text"/>
</div>
<!-- Nom de famille -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Nom de famille</label>
<input class="w-full h-12 px-md bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all placeholder:text-outline-variant" placeholder="Ex: Dupont" type="text"/>
</div>
</div>
<!-- Gender Selector -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Sexe</label>
<div class="flex p-1 bg-[#F7F7F5] rounded-xl">
<button class="gender-btn flex-1 h-10 rounded-[10px] font-label-md text-label-md transition-all flex items-center justify-center gap-2 bg-white text-primary shadow-sm" data-active="true" onclick="toggleGender(this)">
<span class="material-symbols-outlined text-[18px]">female</span>
                            Féminin
                        </button>
<button class="gender-btn flex-1 h-10 rounded-[10px] font-label-md text-label-md transition-all flex items-center justify-center gap-2 text-on-surface-variant" data-active="false" onclick="toggleGender(this)">
<span class="material-symbols-outlined text-[18px]">male</span>
                            Masculin
                        </button>
</div>
</div>
<!-- Date of Birth -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Date de naissance</label>
<div class="relative">
<input class="w-full h-12 pl-md pr-12 bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all appearance-none" type="date"/>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline pointer-events-none">calendar_today</span>
</div>
</div>
</div>
</section>
<!-- Form Section: PARENT / TUTEUR -->
<section class="space-y-lg">
<h2 class="font-label-bold text-label-bold text-outline uppercase tracking-widest">Parent / Tuteur</h2>
<div class="space-y-md">
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Nom du parent</label>
<input class="w-full h-12 px-md bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all placeholder:text-outline-variant" placeholder="Nom complet" type="text"/>
</div>
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Téléphone</label>
<div class="relative">
<input class="w-full h-12 pl-12 pr-md bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all placeholder:text-outline-variant" placeholder="06 00 00 00 00" type="tel"/>
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">call</span>
</div>
</div>
</div>
</section>
<!-- Form Section: GROUPE -->
<section class="space-y-lg">
<h2 class="font-label-bold text-label-bold text-outline uppercase tracking-widest">Groupe</h2>
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-on-surface-variant ml-1">Assigner à un groupe</label>
<div class="relative">
<select class="w-full h-12 pl-md pr-12 bg-[#F7F7F5] border-none rounded-xl font-body-md text-body-md focus:ring-2 focus:ring-primary focus:bg-white transition-all appearance-none cursor-pointer">
<option disabled="" selected="" value="">Choisir un groupe</option>
<option value="1">Juniors (11-14 ans)</option>
<option value="2">Séniors (15-18 ans)</option>
<option value="3">Équipe Louange</option>
<option value="4">Nouveaux arrivants</option>
</select>
<span class="material-symbols-outlined absolute right-md top-1/2 -translate-y-1/2 text-outline pointer-events-none">expand_more</span>
</div>
</div>
</section>
</main>
<!-- Footer Action -->
<footer class="fixed bottom-0 left-0 w-full p-margin-mobile bg-surface/80 backdrop-blur-md border-t border-surface-variant/30 flex justify-center z-50">
<button class="w-full max-w-2xl h-14 bg-primary text-white font-bold rounded-xl shadow-lg shadow-primary/20 flex items-center justify-center gap-2 active:scale-[0.98] transition-transform hover:bg-[#0e4a32]">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">save</span>
            Enregistrer
        </button>
</footer>
<!-- Bottom Nav Context (Hidden on this transactional page as per mandate, but structure kept if needed for transitions) -->
<script>
        function toggleGender(btn) {
            const container = btn.parentElement;
            const buttons = container.querySelectorAll('.gender-btn');
            
            buttons.forEach(b => {
                b.classList.remove('bg-white', 'text-primary', 'shadow-sm');
                b.classList.add('text-on-surface-variant');
                b.dataset.active = "false";
            });
            
            btn.classList.add('bg-white', 'text-primary', 'shadow-sm');
            btn.classList.remove('text-on-surface-variant');
            btn.dataset.active = "true";
        }

        // Simple animation for input focus
        document.querySelectorAll('input, select').forEach(el => {
            el.addEventListener('focus', () => {
                el.parentElement.classList.add('scale-[1.01]');
                el.parentElement.classList.add('transition-transform');
            });
            el.addEventListener('blur', () => {
                el.parentElement.classList.remove('scale-[1.01]');
            });
        });
    </script>
</body></html>
