            background-color: #0f5238;

        }

            content: '';
            position: absolute;
            top: 2px;
            left: 2px;

            width: 20px;

<body class="font-body-md text-body-md antialiased">
<!-- Header Navigation -->
<header class="bg-surface sticky top-0 z-50 transition-colors duration-200">
<div class="flex items-center justify-between px-margin-mobile py-md w-full max-w-7xl mx-auto">
<div class="flex items-center gap-4">
<button class="p-1 -ml-1 rounded-full hover:bg-surface-container-low transition-colors">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<h1 class="font-headline-lg-mobile text-headline-lg-mobile text-primary">Nouvelle séance</h1>

<div class="flex items-center">
<div class="w-10 h-10 rounded-full bg-surface-container-high flex items-center justify-center overflow-hidden">

</div>
</div>
</div>
</header>
<main class="max-w-md mx-auto px-margin-mobile pt-lg pb-40">
<!-- Illustration / Intro -->
<div class="flex flex-col items-center mb-xl">
<div class="w-20 h-20 bg-secondary-container rounded-3xl flex items-center justify-center mb-md shadow-sm">
<span class="material-symbols-outlined text-primary text-4xl" style="font-variation-settings: 'opsz' 48;">calendar_add_on</span>
</div>
<h2 class="font-headline-md text-headline-md text-on-surface">Créer une séance</h2>
<p class="text-on-surface-variant text-center px-4 mt-2">Planifiez un nouveau rassemblement et gérez les présences de votre groupe.</p>
</div>
<!-- Form Section -->
<form class="space-y-lg">
<!-- Group Selection -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-outline uppercase tracking-wider pl-1">Groupe</label>
<div class="relative group">
<select class="w-full h-14 bg-[#F7F7F5] border-0 rounded-xl px-4 appearance-none focus:ring-2 focus:ring-primary transition-all text-body-lg font-body-lg">
<option>Groupe des Ados (12-15)</option>
<option>Jeunes Adultes (16-25)</option>
<option>Éclaireurs</option>
<option>Musique &amp; Louange</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">expand_more</span>
</div>
</div>
<!-- Date Selection -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-outline uppercase tracking-wider pl-1">Date</label>
<div class="relative">
<input class="w-full h-14 bg-[#F7F7F5] border-0 rounded-xl px-4 focus:ring-2 focus:ring-primary transition-all text-body-lg font-body-lg" type="date" value="2023-10-27"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 pointer-events-none text-outline">calendar_today</span>
</div>
</div>
<!-- Time Selection -->
<div class="grid grid-cols-2 gap-gutter">
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-outline uppercase tracking-wider pl-1">Heure Début</label>
<input class="w-full h-14 bg-[#F7F7F5] border-0 rounded-xl px-4 focus:ring-2 focus:ring-primary transition-all text-body-lg font-body-lg" type="time" value="18:30"/>
</div>
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-outline uppercase tracking-wider pl-1">Heure Fin</label>
<input class="w-full h-14 bg-[#F7F7F5] border-0 rounded-xl px-4 focus:ring-2 focus:ring-primary transition-all text-body-lg font-body-lg" type="time" value="20:30"/>
</div>
</div>
<!-- Theme / Description -->
<div class="space-y-xs">
<label class="font-label-bold text-label-bold text-outline uppercase tracking-wider pl-1">Thème (optionnel)</label>
<input class="w-full h-14 bg-[#F7F7F5] border-0 rounded-xl px-4 focus:ring-2 focus:ring-primary transition-all text-body-lg font-body-lg placeholder:text-outline-variant" placeholder="Ex: La persévérance dans la foi" type="text"/>
</div>
<!-- Options Toggles -->
<div class="bg-surface-container-lowest border border-surface-variant rounded-[20px] p-md space-y-md shadow-[0_1px_3px_rgba(0,0,0,0.05)]">
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-lg font-bold text-on-surface">Commencer l'appel tout de suite</span>
<span class="text-label-md text-on-surface-variant">L'écran d'appel s'ouvrira après création</span>
</div>
<label class="relative inline-block w-11 h-6">
<input checked="" class="sr-only peer custom-toggle" type="checkbox"/>
<span class="toggle-slider absolute cursor-pointer inset-0 bg-outline-variant rounded-full transition-all"></span>
</label>
</div>
<div class="h-[1px] bg-surface-variant"></div>
<div class="flex items-center justify-between">
<div class="flex flex-col">
<span class="font-body-lg font-bold text-on-surface">Présence par défaut : Présent</span>
<span class="text-label-md text-on-surface-variant">Marque tout le monde présent au début</span>
</div>
<label class="relative inline-block w-11 h-6">
<input class="sr-only peer custom-toggle" type="checkbox"/>
<span class="toggle-slider absolute cursor-pointer inset-0 bg-outline-variant rounded-full transition-all"></span>
</label>
</div>
</div>
</form>
</main>
<!-- Fixed Footer Action Buttons -->
<footer class="fixed bottom-0 left-0 w-full bg-surface border-t border-surface-variant/50 px-margin-mobile pt-md pb-10 flex flex-col gap-sm z-50">
<button class="w-full h-14 bg-primary text-on-primary rounded-2xl font-headline-md flex items-center justify-center gap-2 active:scale-95 transition-transform duration-150">
<span class="material-symbols-outlined">how_to_reg</span>
            Créer et lancer l'appel
        </button>
<button class="w-full h-14 bg-transparent border-2 border-primary/20 text-primary rounded-2xl font-body-lg font-bold flex items-center justify-center active:scale-95 transition-transform duration-150">
            Créer sans lancer
        </button>
</footer>

        document.querySelectorAll('button, input, select').forEach(el => {
            el.addEventListener('touchstart', () => {
                el.style.opacity = '0.8';
            });
            el.addEventListener('touchend', () => {
                el.style.opacity = '1';
            });
        });

        // Prevention of elastic scroll issues on forms
        document.addEventListener('touchmove', function (e) {
            if (e.target.tagName !== 'INPUT' && e.target.tagName !== 'TEXTAREA') {
                // Allows scroll only on the main container
            }
        }, { passive: false });
    </script>
