<script>
        function updatePreview(color) {
            const preview = document.getElementById('group-icon-preview');
            preview.style.backgroundColor = color;
            
            // Remove previous active rings
            const buttons = document.querySelectorAll('.Color-Picker button');
            // Logic for visual selection state
            const target = event.currentTarget;
            const parent = target.parentElement;
            parent.querySelectorAll('button').forEach(btn => {
                btn.classList.remove('border-2', 'border-primary', 'ring-2', 'ring-offset-2', 'ring-primary');
                btn.classList.add('hover:scale-110');
            });
            target.classList.add('border-2', 'border-primary', 'ring-2', 'ring-offset-2', 'ring-primary');
            target.classList.remove('hover:scale-110');
        }

        // Handle day selection toggles
        document.querySelectorAll('section:nth-of-type(4) button').forEach(button => {
            button.addEventListener('click', () => {
                if(button.classList.contains('bg-secondary-container')) {
                    button.classList.remove('bg-secondary-container', 'text-primary', 'border-primary');
                    button.classList.add('border-outline-variant', 'text-on-surface-variant', 'bg-surface');
                } else {
                    button.classList.add('bg-secondary-container', 'text-primary', 'border-primary');
                    button.classList.remove('border-outline-variant', 'text-on-surface-variant', 'bg-surface');
                }
            });
        });
    </script>
