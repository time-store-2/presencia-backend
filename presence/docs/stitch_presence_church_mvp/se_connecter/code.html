<style>
        body {
            font-family: 'Plus Jakarta Sans', sans-serif;
            background-color: #FAFAF8;
        }

    body {
      min-height: max(884px, 100dvh);

<body class="min-h-screen flex flex-col items-center justify-center p-gutter relative overflow-x-hidden">
<!-- Background Atmospheric Element -->
<div class="fixed inset-0 z-0 pointer-events-none opacity-20 dark:opacity-10">

</div>
<!-- Main Auth Container -->
<main class="relative z-10 w-full max-w-[400px] flex flex-col items-center gap-lg">
<!-- Logo & Header -->
<div class="text-center flex flex-col items-center gap-sm">
<div class="w-16 h-16 bg-primary rounded-[20px] flex items-center justify-center shadow-lg shadow-primary/20 mb-xs">
<span class="material-symbols-outlined text-on-primary text-[32px]">park</span>
</div>
<h1 class="text-[26px] font-extrabold text-on-background leading-tight">Bon retour 👋</h1>
<p class="font-body-md text-on-surface-variant">Connectez-vous pour retrouver vos données</p>
</div>
<!-- Connection Card -->
<div class="w-full bg-white dark:bg-surface-container-low p-8 rounded-[20px] shadow-xl shadow-primary/5">
<form class="flex flex-col gap-5" id="loginForm" onsubmit="event.preventDefault(); document.getElementById('errorMessage').classList.remove('hidden');">
<!-- Email Field -->
<div class="flex flex-col gap-2">
<label class="font-label-md text-on-surface-variant" for="email">Email</label>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-primary transition-colors">mail</span>
<input class="w-full h-14 pl-12 pr-4 bg-surface-container-low dark:bg-surface-dim border-none rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all placeholder:text-outline" id="email" placeholder="votre@email.com" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="flex flex-col gap-2">
<div class="flex justify-between items-center">
<label class="font-label-md text-on-surface-variant" for="password">Mot de passe</label>
<a class="text-label-md text-primary font-bold hover:underline" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative flex items-center group">
<span class="material-symbols-outlined absolute left-4 text-on-surface-variant group-focus-within:text-primary transition-colors">lock</span>
<input class="w-full h-14 pl-12 pr-12 bg-surface-container-low dark:bg-surface-dim border-none rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary transition-all placeholder:text-outline" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-4 text-on-surface-variant hover:text-primary transition-colors" type="button">
<span class="material-symbols-outlined">visibility</span>
</button>
</div>
</div>
<!-- Error Message -->
<div class="hidden flex items-center gap-3 p-4 bg-[#FDF5F5] dark:bg-error-container/20 rounded-xl border border-error/10 animate-in fade-in slide-in-from-top-2" id="errorMessage">
<span class="material-symbols-outlined text-error" data-icon="error">error</span>
<p class="text-label-md text-error">Email ou mot de passe incorrect</p>
</div>
<!-- Submit Button -->
<button class="w-full h-14 bg-primary text-on-primary font-label-md rounded-full shadow-lg shadow-primary/20 hover:scale-[1.02] active:scale-95 transition-all duration-200" type="submit">
                    Se connecter
                </button>
</form>
<!-- Separator -->
<div class="flex items-center gap-4 my-8">
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
<span class="text-label-sm text-on-surface-variant">OU CONTINUER AVEC</span>
<div class="h-[1px] flex-1 bg-outline-variant/30"></div>
</div>
<!-- Social Buttons -->
<div class="grid grid-cols-2 gap-4">
<button class="flex items-center justify-center gap-3 h-12 border-[1.5px] border-outline-variant/50 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuB9XvhOh-Zek-Orpn9r8sW5aZHsOqUlXnc8x5j06zKywIpk_bR6ECOkXO1V_zUWTwutICg6qEL28u5aCPkyfapifMMW1jIAIbtlTBZjBCge26tWGQPgfAvzQ4i4wfHRykKaMh7ChIjFzldXz2j_ycvyd3Lh6sFZuAi5Z2GbMAGafqFz0Hobl10O8lqyZKVQSqoFs9-PJTeU3pZ6R7xF1TmrMAG3twv-sFQVh9XJCArNARHTMDgzX42DYVx6NbEqspaPxwPIqWsl"/>
<span class="font-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-3 h-12 border-[1.5px] border-outline-variant/50 rounded-full hover:bg-surface-container-high transition-colors active:scale-95 transition-transform">
<img alt="Facebook" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAkbtTtmWAC1S3TKEy6kX9ZPV-BToFlnWwk3Y5M2XCVhYH_3c_kUjaXWApe9rJBsxxJNSoRCqO4Mi_HQzT7473-uFJDucTANVFXGWEX4gKhsBkmhY_mmTmh8E40TBbwq2UN6UzjQvzuArNeNbVY707_y5tHky43nCmsSyYPvHI1s1xhrsHjeqcqhgmUBejM0h6jnzw6PjKzPgmQKZe_I1-RZjU_NYiEUiQwnib4a5Gp08wF8Dierukv92j7Mgc5HtHaX_sh36y7"/>
<span class="font-label-md text-on-surface">Facebook</span>
</button>
</div>
</div>
<!-- Bottom Link -->
<p class="font-body-md text-on-surface-variant">
            Pas encore de compte ? 
            <a class="text-primary font-bold hover:underline" href="/auth/inscription">Créer un compte</a>
</p>
</main>
<!-- Visual Polish: Soft Decorative Blobs -->
<div class="absolute top-[-10%] right-[-10%] w-[40%] h-[40%] bg-primary/5 blur-[120px] rounded-full pointer-events-none"></div>
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[40%] bg-secondary/5 blur-[120px] rounded-full pointer-events-none"></div>
<script>
        // Micro-interactions and ripple effects
        document.querySelectorAll('button').forEach(button => {
            button.addEventListener('click', function(e) {
                let ripple = document.createElement('span');
                ripple.classList.add('ripple');
                this.appendChild(ripple);
                let x = e.clientX - e.target.offsetLeft;
                let y = e.clientY - e.target.offsetTop;
                ripple.style.left = `${x}px`;
                ripple.style.top = `${y}px`;
                setTimeout(() => ripple.remove(), 600);
            });
        });
    </script>
<style>
        .ripple {
            position: absolute;
            background: rgba(255, 255, 255, 0.3);
            transform: translate(-50%, -50%);
            pointer-events: none;
            border-radius: 50%;
            animation: ripple-animation 0.6s linear;
        }
        @keyframes ripple-animation {
            from { width: 0; height: 0; opacity: 0.5; }
            to { width: 500px; height: 500px; opacity: 0; }
        }
    </style>
</body></html>
