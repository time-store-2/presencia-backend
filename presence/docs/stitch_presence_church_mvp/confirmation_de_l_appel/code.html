<!-- Success micro-interaction -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            // Simple logic to handle button feedback
            const buttons = document.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.addEventListener('click', function(e) {
                    const ripple = document.createElement('span');
                    ripple.className = 'absolute inset-0 bg-white/20 rounded-2xl pointer-events-none opacity-0 transition-opacity duration-300';
                    this.classList.add('relative');
                    this.appendChild(ripple);
                    setTimeout(() => ripple.classList.add('opacity-100'), 0);
                    setTimeout(() => ripple.classList.remove('opacity-100'), 200);
                    setTimeout(() => ripple.remove(), 500);
                });
            });
        });
    </script>
