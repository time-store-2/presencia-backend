<!-- Hidden Scripts for basic interactions -->
<script>
        // Simple logic to simulate chip selection
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('click', function() {
                if(this.classList.contains('bg-surface-container-high')) {
                    this.classList.remove('bg-surface-container-high', 'text-on-surface-variant');
                    this.classList.add('bg-primary-container', 'text-on-primary');
                } else if (this.classList.contains('bg-primary-container') && !this.closest('div').classList.contains('p-margin-mobile')) {
                    this.classList.add('bg-surface-container-high', 'text-on-surface-variant');
                    this.classList.remove('bg-primary-container', 'text-on-primary');
                }
            });
        });
    </script>
