<style>
        body { font-family: 'Inter', sans-serif; background-color: #F9FAFB; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .form-input-focus:focus {
            outline: none;

        }
        .custom-radio:checked + label {
            background-color: #EEF2FF;
            border-color: #4F46E5;
            color: #4F46E5;
        }

    body {
      min-height: max(884px, 100dvh);
    }

<body class="bg-background min-h-screen pb-32">
<!-- Top Navigation Bar -->
<header class="bg-surface shadow-sm sticky top-0 z-50 flex justify-between items-center px-margin-mobile h-16 w-full">
<div class="flex items-center gap-4">
<button class="transition-all duration-200 active:scale-95 text-on-surface-variant" onclick="window.history.back()">
<span class="material-symbols-outlined">arrow_back</span>
</button>
<h1 class="font-headline-md text-headline-md text-on-surface">Nouvel adolescent</h1>
</div>
<div class="flex items-center">
<span class="material-symbols-outlined text-primary">church</span>
</div>
</header>
<main class="max-w-2xl mx-auto p-md space-y-lg">
<!-- Photo Upload Section -->
<section class="flex flex-col items-center justify-center py-lg">
<div class="relative group cursor-pointer">
<div class="w-32 h-32 rounded-full bg-surface-container-high flex items-center justify-center text-outline overflow-hidden border-4 border-white shadow-sm">
<span class="material-symbols-outlined text-[64px]" style="font-variation-settings: 'FILL' 1;">person</span>
</div>
<label class="absolute bottom-0 right-0 bg-primary-container text-white p-2 rounded-full shadow-lg cursor-pointer transition-transform hover:scale-110 active:scale-90" for="photo-upload">
<span class="material-symbols-outlined text-[20px]">photo_camera</span>
<input accept="image/*" class="hidden" id="photo-upload" type="file"/>
</label>
</div>
<p class="mt-sm font-label-md text-label-md text-primary">Ajouter une photo</p>
</section>
<!-- Main Form -->
<form class="space-y-lg">
<!-- Basic Identity -->
<div class="grid grid-cols-1 md:grid-cols-2 gap-md bg-white p-md rounded-xl shadow-sm">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Prénom</label>
<input class="w-full h-12 px-md bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="ex: David" type="text"/>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Nom</label>
<input class="w-full h-12 px-md bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="ex: Koffi" type="text"/>
</div>
</div>
<!-- Demographics -->
<div class="bg-white p-md rounded-xl shadow-sm space-y-md">
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Sexe</label>
<div class="flex gap-sm">
<div class="flex-1">
<input class="hidden custom-radio" id="masculin" name="sexe" type="radio"/>
<label class="flex items-center justify-center h-12 border border-outline-variant rounded-xl font-label-md text-on-surface-variant cursor-pointer transition-all hover:bg-surface-container-low" for="masculin">
                                Masculin
                            </label>
</div>
<div class="flex-1">
<input class="hidden custom-radio" id="feminin" name="sexe" type="radio"/>
<label class="flex items-center justify-center h-12 border border-outline-variant rounded-xl font-label-md text-on-surface-variant cursor-pointer transition-all hover:bg-surface-container-low" for="feminin">
                                Féminin
                            </label>
</div>
</div>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Date de naissance</label>
<div class="relative">
<input class="w-full h-12 pl-md pr-12 bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all" type="date"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">calendar_today</span>
</div>
</div>
</div>
<!-- Parent Section -->
<div class="bg-white p-md rounded-xl shadow-sm space-y-md">
<h3 class="font-label-md text-label-md text-primary tracking-widest uppercase">Information Parent</h3>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Nom du parent</label>
<input class="w-full h-12 px-md bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="Nom complet du tuteur" type="text"/>
</div>
<div class="space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Téléphone</label>
<div class="relative">
<input class="w-full h-12 pl-md pr-12 bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all" placeholder="+225 00 00 00 00" type="tel"/>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant">phone</span>
</div>
</div>
</div>
<!-- Church Group -->
<div class="bg-white p-md rounded-xl shadow-sm space-y-xs">
<label class="block font-label-md text-label-md text-on-surface-variant tracking-wider uppercase">Groupe</label>
<div class="relative">
<select class="w-full h-12 px-md bg-white border border-outline-variant rounded-xl font-body-md text-on-surface focus:ring-2 focus:ring-primary focus:border-primary transition-all appearance-none">
<option disabled="" selected="" value="">Choisir un groupe</option>
<option value="chorale">Chorale des Jeunes</option>
<option value="ecoledimanche">École du Dimanche</option>
<option value="evangelisation">Équipe d'Évangélisation</option>
<option value="accueil">Service d'Accueil</option>
</select>
<span class="material-symbols-outlined absolute right-4 top-1/2 -translate-y-1/2 text-on-surface-variant pointer-events-none">expand_more</span>
</div>
</div>
<!-- Save Button -->
<div class="fixed bottom-20 left-0 w-full px-md md:static md:px-0 md:pt-lg">
<button class="w-full h-14 bg-primary text-white font-label-md text-label-md tracking-widest uppercase rounded-xl shadow-lg shadow-primary/20 hover:bg-primary/90 active:scale-95 transition-all flex items-center justify-center gap-2" type="submit">
<span class="material-symbols-outlined">save</span>
                    Enregistrer
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Bar (Hidden on "Add" flow prioritize content as per mandate, but included for context shell if needed for root navigation) -->
<!-- Determined as Focused Journey - Shell suppressed per UX goal in prompt hierarchy -->
<script>
        // Micro-interactions
        document.querySelectorAll('input, select').forEach(element => {
            element.addEventListener('focus', () => {
                element.parentElement.closest('.shadow-sm')?.classList.add('ring-1', 'ring-primary-container/20');
            });
            element.addEventListener('blur', () => {
                element.parentElement.closest('.shadow-sm')?.classList.remove('ring-1', 'ring-primary-container/20');
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            // Success animation or feedback logic here
            alert('Profil enregistré avec succès !');
        });
    </script>
</body></html>
