<style>
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .custom-shadow {
            shadow-sm: 0px 1px 2px 0px rgba(0, 0, 0, 0.05);
        }

    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-background text-on-surface font-body-md min-h-screen flex flex-col">
<!-- Top Navigation Bar -->
<header class="bg-surface shadow-sm sticky top-0 z-50 flex justify-between items-center px-margin-mobile h-16 w-full">
<button aria-label="Retour" class="flex items-center justify-center w-10 h-10 rounded-full transition-all duration-200 active:scale-95 hover:bg-surface-container-low">
<span class="material-symbols-outlined text-on-surface">arrow_back</span>
</button>
<div class="font-headline-lg text-headline-lg font-bold text-primary">ChurchPresence</div>
<div class="w-10"></div> <!-- Spacer for balance -->
</header>
<main class="flex-1 flex flex-col items-center justify-center px-margin-mobile py-xl">
<!-- Content Card Container -->
<div class="w-full max-w-md bg-white rounded-xl shadow-sm p-lg flex flex-col items-center text-center">
<!-- Icon Illustration -->
<div class="w-20 h-20 rounded-full flex items-center justify-center bg-[#EEF2FF] mb-lg transition-transform duration-300 hover:scale-105">
<span class="material-symbols-outlined text-[40px] text-[#4F46E5]" style="font-variation-settings: 'wght' 500;">lock_open</span>
</div>
<!-- Title & Sub-text -->
<h1 class="text-[22px] font-[800] text-on-surface mb-sm leading-tight">
                Mot de passe oublié ?
            </h1>
<p class="text-[#6B7280] font-body-md mb-xl max-w-[280px]">
                Entrez votre adresse email. Nous vous enverrons un lien pour réinitialiser votre mot de passe.
            </p>
<!-- Form -->
<form action="#" class="w-full space-y-lg" onsubmit="event.preventDefault();">
<div class="text-left">
<label class="block font-label-md text-label-md text-on-surface-variant mb-base px-base" for="email">
                        Adresse email
                    </label>
<div class="relative group">
<input class="w-full h-12 px-md bg-white border border-[#E5E7EB] rounded-xl focus:ring-2 focus:ring-[#4F46E5] focus:border-transparent outline-none transition-all duration-200 font-body-md text-on-surface placeholder:text-outline-variant" id="email" name="email" placeholder="votre@email.com" required="" type="email"/>
<div class="absolute inset-y-0 right-md flex items-center text-outline-variant">
<span class="material-symbols-outlined">mail</span>
</div>
</div>
</div>
<!-- Submit Button -->
<button class="group w-full h-12 bg-[#4F46E5] text-white rounded-xl font-headline-md flex items-center justify-center gap-sm transition-all duration-200 active:scale-95 shadow-md hover:bg-opacity-90" type="submit">
<span class="font-semibold">Envoyer le lien</span>
<span class="material-symbols-outlined transition-transform duration-300 group-hover:translate-x-1">send</span>
</button>
</form>
<!-- Footer Links -->
<div class="mt-xl flex flex-col gap-sm">
<button class="text-primary font-label-md hover:underline decoration-2 transition-all">
                    Se connecter à nouveau
                </button>
<div class="text-label-sm text-outline-variant flex items-center justify-center gap-xs mt-base">
<span class="material-symbols-outlined text-[14px]">shield</span>
<span>Connexion sécurisée par Ecclesia Flow</span>
</div>
</div>
</div>
<!-- Decorative Element (App-First feel) -->
<div class="mt-xl opacity-20 hidden sm:block">
<div class="flex gap-lg grayscale pointer-events-none">
<span class="material-symbols-outlined text-on-surface text-[64px]">church</span>
<span class="material-symbols-outlined text-on-surface text-[64px]">diversity_3</span>
</div>
</div>
</main>
<script>
        // Simple Micro-interaction for feedback
        const form = document.querySelector('form');
        const button = form.querySelector('button');
        const originalText = button.querySelector('span:first-child').innerText;

        form.addEventListener('submit', () => {
            button.classList.add('pointer-events-none', 'opacity-80');
            button.querySelector('span:first-child').innerText = 'Envoi...';
            
            setTimeout(() => {
                button.querySelector('span:first-child').innerText = 'Lien envoyé !';
                button.classList.replace('bg-[#4F46E5]', 'bg-secondary');
                
                setTimeout(() => {
                    button.classList.remove('pointer-events-none', 'opacity-80');
                    button.classList.replace('bg-secondary', 'bg-[#4F46E5]');
                    button.querySelector('span:first-child').innerText = originalText;
                }, 3000);
            }, 1500);
        });

        // Hover effect for input
        const input = document.getElementById('email');
        input.addEventListener('focus', () => {
            input.parentElement.querySelector('.material-symbols-outlined').style.color = '#4F46E5';
        });
        input.addEventListener('blur', () => {
            input.parentElement.querySelector('.material-symbols-outlined').style.color = '';
        });
    </script>
</body></html>
