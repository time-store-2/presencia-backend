<style>

<body class="bg-background min-h-screen flex flex-col items-center justify-center p-margin-mobile">
<!-- Login Container -->
<main class="w-full max-w-[440px] flex flex-col items-center">
<!-- Logo & Header Section -->
<div class="text-center mb-xl">
<div class="inline-flex items-center justify-center w-12 h-12 bg-primary-container rounded-xl mb-md shadow-sm">
<span class="material-symbols-outlined text-on-primary text-3xl" style="font-variation-settings: 'FILL' 1;">church</span>
</div>
<h1 class="font-display text-display text-on-background mb-sm">Bon retour 👋</h1>
<p class="font-body-lg text-body-lg text-on-surface-variant">Connectez-vous pour retrouver vos données</p>
</div>
<!-- Form Card -->
<div class="w-full bg-surface-container-lowest rounded-xl p-lg shadow-sm border border-outline-variant/30">
<form class="space-y-md" id="loginForm">
<!-- Email Field -->
<div class="space-y-xs">
<label class="font-label-md text-label-md text-on-surface-variant block" for="email">Email</label>
<div class="relative">
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="email" placeholder="nom@eglise.fr" required="" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<div class="flex justify-between items-center">
<label class="font-label-md text-label-md text-on-surface-variant block" for="password">Mot de passe</label>
<a class="font-label-md text-label-md text-primary hover:underline" href="#">Mot de passe oublié ?</a>
</div>
<div class="relative">
<input class="w-full h-12 px-md font-body-md text-body-md border border-outline-variant rounded-xl focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all" id="password" placeholder="••••••••" required="" type="password"/>
<button class="absolute right-md top-1/2 -translate-y-1/2 text-outline-variant hover:text-on-surface-variant" onclick="togglePassword()" type="button">
<span class="material-symbols-outlined text-[20px]" id="passwordIcon">visibility</span>
</button>
</div>
</div>
<!-- Submit Button -->
<button class="w-full h-12 bg-primary-container text-on-primary font-label-md text-label-md rounded-xl btn-hover-effect transition-all flex items-center justify-center gap-sm mt-md shadow-md shadow-primary/10" type="submit">
                    Se connecter
                    <span class="material-symbols-outlined text-[18px]">login</span>
</button>
</form>
<!-- Social Divider -->
<div class="relative my-lg">
<div class="absolute inset-0 flex items-center">
<div class="w-full border-t border-outline-variant/40"></div>
</div>
<div class="relative flex justify-center text-label-sm">
<span class="px-md bg-surface-container-lowest text-on-surface-variant font-label-md">ou</span>
</div>
</div>
<!-- Social Buttons Grid -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm h-12 border border-outline-variant rounded-xl font-label-md text-label-md text-on-background hover:bg-surface-container-low transition-colors btn-hover-effect">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuBWUeK5j_it_QkNk7OCzODzD10hKhLqMUYolpAoaJkLepaL76B8Lwi6eRux6azBlyaSwF4MW_KuM9TkDy6H1HKDCtB1Ct_NnoxHPkwygM8Z4iCPdvJwLy8elEhC_qWzEewwe_24ikRyi5ZBsPaOl3xUzXJ97BHkR-Pi9Xx7RFvPl2A05JE9OrDv_37w-QC3tyA8G7eNpaj5yebeijzjXFeHWwPFPkxZfrSrQP2kY1hKaujLCuLDNS1wV8T4zQc4Su_hM8pod8r6YbM"/>
                    Google
                </button>
<button class="flex items-center justify-center gap-sm h-12 border border-outline-variant rounded-xl font-label-md text-label-md text-on-background hover:bg-surface-container-low transition-colors btn-hover-effect">
<span class="material-symbols-outlined text-[22px]" style="font-variation-settings: 'FILL' 1;">apps</span>
                    Apple
                </button>
</div>
</div>
<!-- Create Account Link -->
<p class="mt-xl font-body-md text-body-md text-on-surface-variant">
            Nouveau ici ? 
            <a class="font-label-md text-label-md text-primary font-bold hover:underline ml-xs" href="#">Créer un compte</a>
</p>

<!-- Footer Decoration -->
<div class="fixed bottom-0 left-0 w-full overflow-hidden h-32 pointer-events-none opacity-40">
<div class="absolute bottom-[-10%] left-[-10%] w-[40%] h-[150%] bg-primary/5 blur-[120px] rounded-full"></div>
<div class="absolute bottom-[-20%] right-[-10%] w-[40%] h-[150%] bg-secondary/5 blur-[120px] rounded-full"></div>
</div>
<script>
        function togglePassword() {
            const passwordInput = document.getElementById('password');
            const icon = document.getElementById('passwordIcon');
            if (passwordInput.type === 'password') {
                passwordInput.type = 'text';
                icon.innerText = 'visibility_off';
            } else {
                passwordInput.type = 'password';
                icon.innerText = 'visibility';
            }
        }

        document.getElementById('loginForm').addEventListener('submit', function(e) {
            e.preventDefault();
            // Handle login logic here
            const btn = e.target.querySelector('button[type="submit"]');
            btn.innerHTML = '<span class="animate-spin material-symbols-outlined">progress_activity</span> Connexion...';
            btn.disabled = true;
            
            setTimeout(() => {
                alert('Connexion réussie ! Redirection vers Ecclesia Flow...');
                btn.innerHTML = 'Se connecter <span class="material-symbols-outlined text-[18px]">login</span>';
                btn.disabled = false;
            }, 1500);
        });
    </script>
