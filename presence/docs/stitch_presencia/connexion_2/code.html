<body class="bg-surface-bright min-h-screen flex flex-col justify-center items-center px-container-margin py-xl">
<!-- Auth Container -->
<main class="w-full max-w-[420px] bg-surface-container-lowest rounded-[24px] p-xl auth-card-shadow relative overflow-hidden">
<!-- Header / Logo -->
<header class="flex flex-col items-center mb-xl">
<div class="w-16 h-16 bg-primary-container rounded-2xl flex items-center justify-center mb-md transform rotate-3 shadow-md">
<span class="material-symbols-outlined text-on-primary-container text-[32px]">favorite</span>
</div>
<h1 class="text-headline-lg font-headline-lg text-primary tracking-tight">Presencia</h1>
<p class="text-on-surface-variant text-body-md mt-sm">Bienvenue chez vous.</p>
</header>
<!-- Login Tabs (Visual decoration for UX context) -->
<div class="flex bg-surface-container-low rounded-xl p-xs mb-lg">
<button class="flex-1 py-sm px-md text-label-md font-label-md rounded-lg bg-surface-container-lowest text-primary shadow-sm transition-all duration-300">Se connecter</button>
<button class="flex-1 py-sm px-md text-label-md font-label-md text-on-surface-variant hover:text-primary transition-all duration-300">S'inscrire</button>
</div>
<!-- Social Login Section -->
<section class="space-y-md mb-xl">
<button class="w-full flex items-center justify-center gap-md py-md px-lg bg-surface-container-lowest border-1.5 border-outline-variant rounded-xl text-body-md font-semibold text-on-surface hover:bg-surface-container transition-all">
<img alt="Google" class="w-5 h-5" src="https://lh3.googleusercontent.com/aida-public/AB6AXuAL_Z-we9aDGNCi2jQw96kDfLZTZ6NfOBvduBYXfjwac7InMSNzPaQsLvr3HeKjPbHiq_v0DjZveylmYlcHU0VIXcpxcr0Dxtm83y0k30P8bT-AqR98RClJuxL8qAV8nhHDmz2v3Z8-UkO-vVjWnyOTOP0jg3tg1PA5sCDeHfoZzDirTEa1kyDwU3BFHaRHa6qf157zMtAwyzv8vJbMn2eqFHgcS-rT5pJJgpp7to8yVQKczG0mzl-HmUpuNvUcie7SaA1N-m_jDA"/>
                Continuer avec Google
            </button>
<button class="w-full flex items-center justify-center gap-md py-md px-lg bg-inverse-surface rounded-xl text-body-md font-semibold text-inverse-on-surface hover:opacity-90 transition-all">
<span class="material-symbols-outlined text-[20px]">apps</span>
                Continuer avec Apple
            </button>
</section>
<!-- Divider -->
<div class="flex items-center gap-md mb-xl">
<div class="flex-1 h-[1px] bg-outline-variant opacity-50"></div>
<span class="text-label-sm font-label-sm text-outline uppercase tracking-widest">ou avec email</span>
<div class="flex-1 h-[1px] bg-outline-variant opacity-50"></div>
</div>
<!-- Email Form -->
<form action="#" class="space-y-lg" method="POST" onsubmit="event.preventDefault();">
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant ml-unit" for="email">Email</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">mail</span>
<input class="w-full pl-[44px] pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60" id="email" placeholder="nom@exemple.com" type="email"/>
</div>
</div>
<div class="space-y-xs">
<div class="flex justify-between items-center px-unit">
<label class="text-label-md font-label-md text-on-surface-variant" for="password">Mot de passe</label>
<a class="text-label-md font-label-md text-primary hover:underline" href="#">Oublié ?</a>
</div>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline text-[20px]">lock</span>
<input class="w-full pl-[44px] pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-xl text-body-md focus:ring-2 focus:ring-primary focus:border-primary outline-none transition-all placeholder:text-outline/60" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Primary Action -->
<button class="w-full py-md px-lg bg-primary text-on-primary rounded-xl font-semibold text-body-lg hover:bg-primary-container active:scale-[0.98] transition-all shadow-lg mt-md" type="submit">
                S'identifier
            </button>
</form>
<!-- Secondary Note -->
<footer class="mt-xl text-center">
<p class="text-body-md text-on-surface-variant">
                Pas encore de compte ? 
                <a class="text-primary font-bold hover:underline" href="#">Rejoindre la communauté</a>
</p>
</footer>
<!-- Bottom Sheet Visual Accent -->
<div class="absolute -bottom-16 -right-16 w-32 h-32 bg-primary/5 rounded-full blur-2xl"></div>
<div class="absolute -top-16 -left-16 w-32 h-32 bg-secondary/5 rounded-full blur-2xl"></div>
</main>
<!-- Decorative Image (Mobile/Tablet View optimization) -->
<div class="hidden lg:block fixed left-12 top-1/2 -translate-y-1/2 w-[350px]">
<div class="bg-surface-container p-lg rounded-[32px] transform -rotate-2">
<div class="aspect-square rounded-2xl overflow-hidden mb-md shadow-xl">
<img class="w-full h-full object-cover" data-alt="A warm and inviting interior of a modern community center with terracotta walls, wooden furniture, and soft sunlight streaming through large windows. Young people are seen in a blurry background, creating a sense of vibrant yet calm community life. The visual style is professional with a tactile warmth, aligning with the radical hospitality theme." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBqhTSf5z8fqNJZJKFYC5nZMGHycT-2cNzIJ4gjRahldCKtN5JGGBaPcjrdbfRvDZD3IZo_Z2MMWkgXYTpRCZGHwgvSCddBjHL_nCHp6mpyRHMjBJc5oiTbra0ntsY89vCMXHC2wlzJbasYEGqW8SmL47y6lnpZf5QSsQE0WhxWeSwhG-0c6demsnKxyKeN50gey65oFhrKcnbM_tkxJgwSEubX5CSSri4ZiNd8AiU0jFSjVVWM4UYYHqLqj6V0DgfzGsZsG-NR1w"/>
</div>
<p class="text-primary font-headline-md italic">"Ici, chaque personne compte."</p>
</div>
</div>
<!-- Background Layer (Global) -->
<div class="fixed inset-0 -z-10 bg-surface-bright pointer-events-none">
<div class="absolute top-0 right-0 w-1/3 h-1/3 bg-primary/5 rounded-full blur-[120px]"></div>
<div class="absolute bottom-0 left-0 w-1/3 h-1/3 bg-secondary/5 rounded-full blur-[120px]"></div>
</div>
<script>
        // Micro-interaction for inputs
        document.querySelectorAll('input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.parentElement.classList.add('scale-[1.01]');
            });
            input.addEventListener('blur', () => {
                input.parentElement.parentElement.classList.remove('scale-[1.01]');
            });
        });

        // Simple tab toggle animation
        const tabs = document.querySelectorAll('.flex.bg-surface-container-low button');
        tabs.forEach(tab => {
            tab.addEventListener('click', () => {
                tabs.forEach(t => {
                    t.classList.remove('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                    t.classList.add('text-on-surface-variant');
                });
                tab.classList.add('bg-surface-container-lowest', 'text-primary', 'shadow-sm');
                tab.classList.remove('text-on-surface-variant');
            });
        });
    </script>
</body></html>
