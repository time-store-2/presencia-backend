<body class="font-body-md text-on-surface">
<!-- Top App Bar -->
<header class="bg-surface sticky top-0 z-40 flex justify-between items-center px-container-margin py-md w-full">
<div class="flex items-center gap-md">
<button class="p-xs hover:bg-surface-container-low transition-colors rounded-full" onclick="history.back()">
<span class="material-symbols-outlined text-primary">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md font-bold text-primary">Recherche &amp; Filtres</h1>
</div>
<div class="w-10 h-10 rounded-full overflow-hidden border-2 border-primary-fixed">
<img alt="Profile" data-alt="A professional and warm portrait of a young adult youth leader with a friendly smile, set against a soft-focus background of a modern community center. The lighting is warm and natural, emphasizing a welcoming 'Radical Hospitality' atmosphere. The image uses a palette of soft terracottas and warm wood tones to match the church app aesthetic." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDyG58Qq1hFqRuHizQxl4nonAGkkddxX4pRdKSVIETmqQpu3rZoZX1IlgnMOxYD7Ww8rz3vJ2cO6kvlGGoXD-JrMq5Ot7qhcIhiAsU7tob-5pCVOM3TBOWzYkNdybsfHWJFYpyCIW-Uixbui8jD56qfzUJ7utdE0BHkohQLpvge0oz5htttpKEnXR_9MKEAi62xlKcppAPihiMMGqYhg1-XU4FDBBB1O3ao4KEOA8hF2pohbi2S-4nnvCS7BLL6cGR-fTPjGrdCdg"/>
</div>
</header>
<main class="pb-32 px-container-margin pt-md max-w-2xl mx-auto">
<!-- Search Section -->
<section class="mb-lg">
<div class="relative group">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">search</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface-container-lowest border border-outline-variant rounded-xl focus:border-primary focus:ring-0 transition-all text-body-lg font-body-lg placeholder:text-outline/60 outline-none custom-shadow" placeholder="Rechercher un jeune..." type="text"/>
</div>
</section>
<!-- Filter Sections -->
<div class="space-y-xl">
<!-- Assiduité Section -->
<section>
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">analytics</span>
<h2 class="text-label-md font-label-md uppercase tracking-wider text-outline">Par assiduité</h2>
</div>
<div class="grid grid-cols-1 gap-sm">
<button class="filter-option flex items-center justify-between p-md bg-surface-container-lowest rounded-xl custom-shadow hover:bg-surface-container-low transition-all active:scale-[0.98]" onclick="toggleSelection(this)">
<span class="text-body-md font-medium">Toujours présents</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity">check_circle</span>
</button>
<button class="filter-option flex items-center justify-between p-md bg-surface-container-lowest rounded-xl custom-shadow hover:bg-surface-container-low transition-all active:scale-[0.98]" onclick="toggleSelection(this)">
<span class="text-body-md font-medium">Souvent absents</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity">check_circle</span>
</button>
<button class="filter-option flex items-center justify-between p-md bg-surface-container-lowest rounded-xl custom-shadow hover:bg-surface-container-low transition-all active:scale-[0.98]" onclick="toggleSelection(this)">
<span class="text-body-md font-medium">Absents depuis longtemps</span>
<span class="material-symbols-outlined text-primary opacity-0 transition-opacity">check_circle</span>
</button>
</div>
</section>
<!-- Groupes Section -->
<section>
<div class="flex items-center gap-sm mb-md">
<span class="material-symbols-outlined text-primary" style="font-variation-settings: 'FILL' 1;">groups</span>
<h2 class="text-label-md font-label-md uppercase tracking-wider text-outline">Par groupe</h2>
</div>
<div class="flex flex-wrap gap-sm">

<button class="chip px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md transition-all active:scale-90" onclick="toggleChip(this)">Accueil</button>
<button class="chip px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md transition-all active:scale-90" onclick="toggleChip(this)">Tech &amp; Media</button>
<button class="chip px-md py-sm rounded-full bg-surface-container-highest text-on-surface-variant font-label-md transition-all active:scale-90" onclick="toggleChip(this)">Enfants</button>

</div>
</div>
</div>
</section>
</div>

<div class="fixed bottom-0 left-0 w-full p-container-margin bg-surface/80 backdrop-blur-md z-50 flex flex-col gap-sm">

<span>Appliquer les filtres</span>
<span class="material-symbols-outlined">filter_list</span>
</button>
<button class="w-full text-primary py-md font-label-md hover:bg-surface-container-low rounded-xl transition-all" onclick="resetFilters()">
            Réinitialiser
        </button>
</div>
<!-- Hidden Bottom Nav for top-level flow (following Shell visibility rule) -->
<!-- Note: BottomNavBar is omitted here as we are in a sub-page/task-focused filter view -->
<script>
        function toggleSelection(el) {
            const icon = el.querySelector('.material-symbols-outlined');
            const isActive = el.classList.contains('border-primary');
            
            // Toggle visual state
            if (isActive) {
                el.classList.remove('border-primary', 'border-2');
                icon.classList.add('opacity-0');
            } else {
                el.classList.add('border-primary', 'border-2');
                icon.classList.remove('opacity-0');
            }
        }

        function toggleChip(el) {
            if (el.classList.contains('filter-chip-active')) {
                el.classList.remove('filter-chip-active');
                el.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
            } else {
                el.classList.add('filter-chip-active');
                el.classList.remove('bg-surface-container-highest', 'text-on-surface-variant');
            }
        }

        function resetFilters() {
            // Reset search
            document.querySelector('input[type="text"]').value = '';
            
            // Reset options
            document.querySelectorAll('.filter-option').forEach(el => {
                el.classList.remove('border-primary', 'border-2');
                el.querySelector('.material-symbols-outlined').classList.add('opacity-0');
            });
            
            // Reset chips
            document.querySelectorAll('.chip').forEach(el => {
                el.classList.remove('filter-chip-active');
                el.classList.add('bg-surface-container-highest', 'text-on-surface-variant');
            });
            
            // Reset dates
            document.querySelectorAll('input[type="date"]').forEach(el => el.value = '');
        }

        // Interaction micro-animations
        document.querySelectorAll('button').forEach(btn => {
            btn.addEventListener('touchstart', () => btn.classList.add('scale-95'));
            btn.addEventListener('touchend', () => btn.classList.remove('scale-95'));
        });
    </script>
</body></html>
