<style>
        body {
            background-color: #FAF7F5;
            font-family: 'Inter', sans-serif;
        }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
        .warm-shadow {
            box-shadow: 0 4px 12px rgba(122, 99, 88, 0.08);
        }
        .glass-overlay {
            backdrop-filter: blur(10px);
            background: rgba(255, 255, 255, 0.7);
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }

  </head>
<body class="bg-surface text-on-surface min-h-screen flex flex-col items-center justify-center p-container-margin">
<div class="w-full max-w-md space-y-lg relative">
<!-- Brand Header Section -->
<header class="text-center space-y-sm mb-xl">
<h1 class="text-display-lg font-display-lg text-primary tracking-tight">Presencia</h1>
<p class="text-body-lg font-body-lg text-on-surface-variant">L'hospitalité radicale au cœur de la jeunesse.</p>
</header>
<!-- Main Login Card -->
<main class="bg-surface-container-lowest rounded-xl p-lg warm-shadow border border-surface-variant/30">
<h2 class="text-headline-lg font-headline-lg text-on-surface mb-lg text-center">Bienvenue</h2>
<form class="space-y-md" onsubmit="return false;">
<!-- Email Field -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant block ml-xs" for="email">Adresse e-mail</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">mail</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface border-1.5 border-outline-variant rounded-xl focus:border-primary focus:ring-0 transition-all text-body-md" id="email" placeholder="nom@eglise.fr" type="email"/>
</div>
</div>
<!-- Password Field -->
<div class="space-y-xs">
<label class="text-label-md font-label-md text-on-surface-variant block ml-xs" for="password">Mot de passe</label>
<div class="relative">
<span class="material-symbols-outlined absolute left-md top-1/2 -translate-y-1/2 text-outline">lock</span>
<input class="w-full pl-[48px] pr-md py-md bg-surface border-1.5 border-outline-variant rounded-xl focus:border-primary focus:ring-0 transition-all text-body-md" id="password" placeholder="••••••••" type="password"/>
</div>
</div>
<!-- Forgot Password -->
<div class="flex justify-end">
<a class="text-label-md font-label-md text-primary hover:underline transition-all" href="#">Mot de passe oublié ?</a>
</div>
<!-- Primary Action Button -->
<button class="w-full bg-primary text-on-primary py-md rounded-xl text-headline-md font-headline-md hover:opacity-90 active:scale-95 transition-all warm-shadow mt-md">
                    Se connecter
                </button>
</form>
<!-- Divider -->
<div class="flex items-center my-lg">
<div class="flex-grow h-px bg-outline-variant"></div>
<span class="px-md text-label-sm font-label-sm text-outline uppercase tracking-wider">Ou continuer avec</span>
<div class="flex-grow h-px bg-outline-variant"></div>
</div>
<!-- Social Logins -->
<div class="grid grid-cols-2 gap-md">
<button class="flex items-center justify-center gap-sm bg-surface border border-outline-variant py-md rounded-xl hover:bg-surface-container-low transition-all active:scale-95">
<img alt="Google" class="w-5 h-5" data-alt="A clean, minimalist representation of a professional Google authentication button, set against a warm white background with a soft drop shadow. The style is modern and corporate, fitting a high-end application interface. The lighting is bright and even, emphasizing a sense of security and clarity." src="https://lh3.googleusercontent.com/aida-public/AB6AXuBPlxPt312wu_JDZr9HgYfA2VCnGdEKgRA7WlbVXf5_1EpfzwnfUmDokzjUtIetswDF3wBohNKi4hHPt19dqVUn6kqkUshxjDk3MAyulLgGplGMnHywh1n1nwuUHzTHz5WcRtsbOgCWHBLC60cUHzh38DNDa7u7WBJNCIFgkvPw4zM6LORvPC0q4ToxslGm1w7A3NycWAFPF4jjpC5gxJNJ64uwWDup5WYH5jLvTf0b1MflucnG1wYHGAx5sZBR4WviEymJjeGgXg"/>
<span class="text-label-md font-label-md text-on-surface">Google</span>
</button>
<button class="flex items-center justify-center gap-sm bg-inverse-surface text-inverse-on-surface py-md rounded-xl hover:opacity-90 transition-all active:scale-95">
<img alt="Apple" class="w-5 h-5 invert" data-alt="A sleek and modern Apple authentication button design for a high-end mobile interface. The button is deep black with a white Apple logo, following the official branding guidelines for digital products. The aesthetic is clean and minimalist, positioned on a soft terracotta-tinted background, projecting reliability and high technology." src="https://lh3.googleusercontent.com/aida-public/AB6AXuDXmNQSyPtw8XooyUfJ_azNWQg2Z5Njj7f2bW7CjYLGcM7Dshfoy0wnUwYYmG_hIkJCtnOo5WnD_m4tRu_7tg03nTgygBXkm1neotYHcqrKKbZRZDSAJ9A9rGjbolGGWQidhv7AcWCLWMOOwA1_ihMp3Fs_j5Ezb1_qfoTEkwHKUey-wom9LuOQzPYyq4ujf-dZFyIGlphkOVXFCGFAUcHExugWTpl8E0ss3AwLZ-GKKwtGRTQ4pobhjoqSAHXVmsW0EG9lQGH2TA"/>
<span class="text-label-md font-label-md">Apple</span>
</button>
</div>
</main>
<!-- Footer / Redirect -->
<footer class="text-center space-y-md">
<p class="text-body-md font-body-md text-on-surface-variant">
                Pas encore de compte ? 
                <a class="text-primary font-bold hover:underline" href="#">Rejoignez-nous</a>
</p>
<div class="flex justify-center gap-lg">
<a class="text-label-sm font-label-sm text-outline hover:text-on-surface transition-colors" href="#">Conditions</a>
<a class="text-label-sm font-label-sm text-outline hover:text-on-surface transition-colors" href="#">Confidentialité</a>
</div>
</footer>
<!-- Background Decorative Element (Abstract warmth) -->
<div class="fixed -bottom-24 -right-24 w-64 h-64 bg-primary-fixed opacity-20 rounded-full blur-3xl -z-10"></div>
<div class="fixed -top-24 -left-24 w-64 h-64 bg-secondary-fixed opacity-20 rounded-full blur-3xl -z-10"></div>
</div>
<!-- Interaction Script -->
<script>
        document.addEventListener('DOMContentLoaded', () => {
            const inputs = document.querySelectorAll('input');
            inputs.forEach(input => {
                input.addEventListener('focus', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#a13a15'; // text-primary
                });
                input.addEventListener('blur', () => {
                    input.parentElement.querySelector('.material-symbols-outlined').style.color = '#8b716a'; // text-outline
                });
            });

            // Micro-interaction for primary button
            const mainBtn = document.querySelector('button.bg-primary');
            mainBtn.addEventListener('mousedown', () => {
                mainBtn.style.transform = 'scale(0.98)';
            });
            mainBtn.addEventListener('mouseup', () => {
                mainBtn.style.transform = 'scale(1)';
            });
        });
    </script>
</body></html>
