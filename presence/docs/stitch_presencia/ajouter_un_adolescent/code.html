<style>

            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }

            box-shadow: 0 4px 12px rgba(122, 99, 88, 0.08);

<body class="bg-surface font-body-md text-on-surface selection:bg-primary-fixed selection:text-on-primary-fixed overflow-x-hidden">
<!-- Top Navigation Bar -->
<header class="bg-surface sticky top-0 z-40 flex justify-between items-center px-container-margin py-md w-full">
<button aria-label="Retour" class="text-on-surface-variant hover:bg-surface-container-low transition-colors p-sm rounded-full flex items-center justify-center">
<span class="material-symbols-outlined" data-icon="arrow_back">arrow_back</span>
</button>
<h1 class="text-headline-md font-headline-md text-on-surface">Ajouter un adolescent</h1>
<div class="w-10"></div> <!-- Spacer for centering -->
</header>
<main class="px-container-margin pb-xl">
<form class="space-y-lg max-w-lg mx-auto" id="add-youth-form">
<!-- Profile Photo Section -->
<section class="flex flex-col items-center justify-center py-lg">
<div class="relative group">
<div class="w-32 h-32 rounded-full bg-surface-container-high border-2 border-dashed border-outline-variant flex items-center justify-center overflow-hidden transition-all group-hover:bg-surface-container-highest cursor-pointer">
<span class="material-symbols-outlined text-outline text-[48px]" data-icon="person">person</span>
<!-- Overlay/Preview would go here -->
</div>
<button class="absolute bottom-0 right-0 bg-primary-container text-on-primary-container p-sm rounded-full shadow-lg active:scale-90 transition-transform" type="button">
<span class="material-symbols-outlined" data-icon="photo_camera" style="font-variation-settings: 'FILL' 1;">photo_camera</span>
</button>
</div>
<p class="text-label-md font-label-md text-outline mt-md">Photo de profil</p>
</section>
<!-- Personal Information -->
<div class="space-y-md">
<h2 class="text-label-md font-label-md text-primary uppercase tracking-wider">Informations personnelles</h2>
<div class="grid grid-cols-1 md:grid-cols-2 gap-md">
<!-- Prenom -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="first_name">Prénom</label>
<input class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl px-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all" id="first_name" name="first_name" placeholder="Ex: Jean" type="text"/>
</div>
<!-- Nom -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="last_name">Nom</label>
<input class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl px-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all" id="last_name" name="last_name" placeholder="Ex: Dupont" type="text"/>
</div>
</div>
<!-- Sexe Selection -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs">Sexe</label>
<div class="flex gap-sm">
<button class="flex-1 py-sm rounded-xl border-[1.5pt] border-outline-variant bg-surface text-body-md font-medium text-on-surface-variant hover:bg-surface-container-low transition-all" data-gender="M" onclick="selectGender(this)" type="button">Masculin</button>
<button class="flex-1 py-sm rounded-xl border-[1.5pt] border-outline-variant bg-surface text-body-md font-medium text-on-surface-variant hover:bg-surface-container-low transition-all" data-gender="F" onclick="selectGender(this)" type="button">Féminin</button>
</div>
</div>
<!-- Date de naissance -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="birth_date">Date de naissance</label>
<div class="relative">
<input class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl px-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all" id="birth_date" name="birth_date" type="date"/>
</div>
</div>
<!-- Groupe -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="group">Groupe</label>
<select class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl px-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all appearance-none" id="group" name="group">
<option disabled="" selected="" value="">Choisir un groupe</option>
<option value="juniors">Juniors (12-14 ans)</option>
<option value="teens">Ados (15-17 ans)</option>
<option value="young_adults">Jeunes Adultes (18+)</option>
</select>
</div>
</div>
<!-- Parents Information -->
<div class="space-y-md pt-md">
<h2 class="text-label-md font-label-md text-primary uppercase tracking-wider">Informations Parents</h2>
<div class="bg-surface-container-low p-md rounded-2xl space-y-md border border-outline-variant/30">
<!-- Nom Parent -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="parent_name">Nom complet du parent</label>
<input class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl px-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all" id="parent_name" name="parent_name" placeholder="Ex: Marie Dupont" type="text"/>
</div>
<!-- Téléphone Parent -->
<div class="space-y-xs">
<label class="block text-label-md font-label-md text-on-surface-variant ml-xs" for="parent_phone">Téléphone</label>
<div class="relative flex items-center">
<span class="material-symbols-outlined absolute left-md text-on-surface-variant text-[20px]" data-icon="call">call</span>
<input class="w-full bg-surface border-outline-variant border-[1.5pt] rounded-xl pl-11 pr-md py-sm focus:border-primary focus:ring-0 text-body-md transition-all" id="parent_phone" name="parent_phone" placeholder="06 00 00 00 00" type="tel"/>
</div>
</div>
</div>
</div>
<!-- Submit Button -->
<div class="pt-xl sticky bottom-0 bg-gradient-to-t from-surface via-surface to-transparent pb-md">
<button class="w-full bg-primary-container text-on-primary-container py-md px-lg rounded-xl font-bold text-body-lg shadow-warm active:scale-[0.98] active:opacity-90 transition-all" type="submit">
                    Enregistrer l'adolescent
                </button>
</div>
</form>
</main>
<!-- Bottom Navigation Bar (Hidden on this focused task screen as per "Suppression" rule) -->
<script>
        function selectGender(button) {
            // Reset all buttons in the same container
            const container = button.parentElement;
            const buttons = container.querySelectorAll('button');
            buttons.forEach(btn => {
                btn.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary-container');
                btn.classList.add('bg-surface', 'text-on-surface-variant', 'border-outline-variant');
            });

            // Select clicked button
            button.classList.remove('bg-surface', 'text-on-surface-variant', 'border-outline-variant');
            button.classList.add('bg-primary-container', 'text-on-primary-container', 'border-primary-container');
        }

        // Form Submission Interaction
        document.getElementById('add-youth-form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalText = btn.innerText;
            
            btn.innerHTML = '<span class="flex items-center justify-center gap-sm"><span class="material-symbols-outlined animate-spin" data-icon="sync">sync</span>Enregistrement...</span>';
            btn.disabled = true;

            setTimeout(() => {
                btn.innerHTML = '<span class="flex items-center justify-center gap-sm"><span class="material-symbols-outlined" data-icon="check_circle">check_circle</span>Enregistré avec succès !</span>';
                btn.classList.replace('bg-primary-container', 'bg-emerald-600');
                
                setTimeout(() => {
                    // Reset or Redirect logic here
                    btn.innerText = originalText;
                    btn.classList.replace('bg-emerald-600', 'bg-primary-container');
                    btn.disabled = false;
                    e.target.reset();
                    // Reset gender buttons
                    const genderBtns = document.querySelectorAll('[data-gender]');
                    genderBtns.forEach(b => b.classList.remove('bg-primary-container', 'text-on-primary-container', 'border-primary-container'));
                }, 2000);
            }, 1500);
        });
    </script>
</body></html>
