<script>
        // Micro-interaction for input fields
        document.querySelectorAll('.custom-input').forEach(input => {
            input.addEventListener('focus', () => {
                input.parentElement.querySelector('label').classList.add('text-primary');
            });
            input.addEventListener('blur', () => {
                input.parentElement.querySelector('label').classList.remove('text-primary');
            });
        });

        // Form submission prevention for demo
        document.querySelector('form').addEventListener('submit', (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button');
            const originalText = btn.innerHTML;
            btn.innerHTML = 'Enregistrement...';
            btn.classList.add('opacity-80');
            
            setTimeout(() => {
                btn.innerHTML = 'Succès !';
                btn.classList.replace('bg-primary', 'bg-emerald-600');
                setTimeout(() => {
                    btn.innerHTML = originalText;
                    btn.classList.replace('bg-emerald-600', 'bg-primary');
                    btn.classList.remove('opacity-80');
                }, 2000);
            }, 1000);
        });
    </script>
